&= (E_n-E_0)^2. \\end{aligned} \\tag{1} 预解算符 R 具有四条最常用的基本性质： 1. 湮灭未扰基态。 由 Q\\lvert 0\\rangle=0 得到 R\\lvert 0\\rangle = 0 和 \\langle 0\\rvert R = 0。 2. 激发态空间上的逆运算。 有 R(H_0 - E_0) = (H_0 - E_0)R = Q。特别地，若 \\lvert \\phi\\rangle 与 \\lvert 0\\rangle 正交，则 R(H_0 - E_0)\\lvert \\phi\\rangle = \\lvert \\phi\\rangle。 3. 幂次公式。 由 \\langle n\\vert m\\rangle=\\delta_{nm} 可以计算 R^2。 \\begin{aligned} R^2 &= \\left(\\sum_{n\\neq 0}\\frac{\\lvert n\\rangle\\langle n\\rvert}{E_n - E_0}\\right)\\left(\\sum_{m\\neq 0}\\frac{\\lvert m\\rangle\\langle m\\rvert}{E_m - E_0}\\right) \\\\ &= \\sum_{n\\neq 0}\\sum_{m\\neq 0}\\frac{\\lvert n\\rangle\\delta_{nm}\\langle m\\rvert}{(E_n - E_0)(E_m - E_0)} \\\\ &= \\sum_{n\\neq 0}\\frac{\\lvert n\\rangle\\langle n\\rvert}{(E_n - E_0)^2}, \\end{aligned} \\tag{2} 一般地，R^k = \\sum_{n\\neq 0}\\frac{\\lvert n\\rangle\\langle n\\rvert}{(E_n - E_0)^k}。 4. 厄米性。 有 R^\\dagger = R。 中间归一化与教材直接归一化的等价性 按小参数 \\lambda 展开精确能量与未归一化波函数 \\lvert \\widetilde{\\Psi}\\rangle： \\begin{aligned} E &= E_0 + \\lambda E^{(1)} + \\lambda^2 E^{(2)} + \\lambda^3 E^{(3)} + \\cdots, \\\\ \\lvert \\widetilde{\\Psi}\\rangle &= \\lvert 0\\rangle + \\lambda\\lvert \\psi_1\\rangle + \\lambda^2\\lvert \\psi_2\\rangle + \\lambda^3\\lvert \\psi_3\\rangle + \\cdots. \\end{aligned} \\tag{3} 中间归一化条件规定精确态在未扰基态上的投影恒为 1： \\langle 0\\vert \\widetilde{\\Psi}\\rangle = 1 \\iff \\langle 0\\vert \\psi_k\\rangle = 0 \\quad (k = 1, 2, 3, \\dots). 也就是说，所有高阶修正 \\lvert \\psi_k\\rangle 都纯粹落在激发态子空间 Q 内（Q\\lvert \\psi_k\\rangle=\\lvert \\psi_k\\rangle）。 若要回到本科教材中满足 \\langle \\Psi\\vert \\Psi\\rangle=1 的直接归一化波函数 \\lvert \\Psi\\rangle，只需在最后除以模长 \\sqrt{\\langle \\widetilde{\\Psi}\\vert \\widetilde{\\Psi}\\rangle}。利用 \\langle 0\\vert \\psi_k\\rangle=0，展开至二阶： \\begin{aligned} \\lvert \\Psi\\rangle &= \\frac{\\lvert \\widetilde{\\Psi}\\rangle}{\\sqrt{\\langle \\widetilde{\\Psi}\\vert \\widetilde{\\Psi}\\rangle}} \\\\ &= \\frac{\\lvert 0\\rangle + \\lambda\\lvert \\psi_1\\rangle + \\lambda^2\\lvert \\psi_2\\rangle + O le. \\end{aligned} 第 2 阶 \\begin{aligned} E^{(2)} &= \\langle 0\\lvert V\\rvert \\psi_1\\rangle = -\\langle 0\\lvert VRV\\rvert 0\\rangle, \\\\ \\lvert \\psi_2\\rangle &= -RV\\lvert \\psi_1\\rangle + E^{(1)}R\\lvert \\psi_1\\rangle \\\\ &= RVRV\\lvert 0\\rangle - E^{(1)}R^2V\\lvert 0\\rangle. \\end{aligned} 第 3 阶 \\begin{aligned} E^{(3)} &= \\langle 0\\lvert V\\rvert \\psi_2\\rangle \\\\ &= \\langle 0\\lvert VRVRV\\rvert 0\\rangle - E^{(1)}\\langle 0\\lvert VR^2V\\rvert 0\\rangle, \\\\ \\lvert \\psi_3\\rangle &= -RV\\lvert \\psi_2\\rangle + E^{(1)}R\\lvert \\psi_2\\rangle + E^{(2)}R\\lvert \\psi_1\\rangle. \\end{aligned} 一阶能量修正为零的特例 以互不耦合的自旋单态二聚体为未扰基态，把二聚体之间的海森堡交换作为微扰时，E^{(1)}=\\langle 0\\lvert V\\rvert 0\\rangle=0。此时前三阶波函数化为 \\begin{aligned} \\lvert \\psi_1\\rangle &= -RV\\lvert 0\\rangle, \\\\ \\lvert \\psi_2\\rangle &= -RV\\lvert \\psi_1\\rangle = +RVRV\\lvert 0\\rangle, \\\\ \\lvert \\psi_3\\rangle &= -RV\\lvert \\psi_2\\rangle + E^{(2)}R\\lvert \\psi_1\\rangle. \\end{aligned} 将教材的二阶求和式写成预解算符形式 下面逐项变形。矩阵元是复数，可以移到右矢的任意一侧。两个能量分母同时换号时，整体符号保持不变，见式 1。 教材中的二阶波函数（不含直接归一化 \\lvert 0\\rangle 项）为： \\begin{aligned} \\lvert \\psi_2\\rangle &= \\sum_{n\\neq 0}\\sum_{m\\neq 0}\\frac{\\langle n\\lvert V\\rvert m\\rangle\\langle m\\lvert V\\rvert 0\\rangle}{(E_0 - E_n)(E_0 - E_m)}\\lvert n\\rangle \\\\ &\\quad - \\sum_{n\\neq 0}\\frac{\\langle 0\\lvert V\\rvert 0\\rangle\\langle n\\lvert V\\rvert 0\\rangle}{(E_0 - E_n)^2}\\lvert n\\rangle. \\end{aligned} 1. 化简第一项 把右矢 \\lvert n\\rangle 挪到最左端，并用 (E_0 - E_n)(E_0 - E_m) = (E_n - E_0)(E_m - E_0) 消去分母负号： \\begin{aligned} &\\sum_{n\\neq 0}\\sum_{m\\neq 0}\\frac{\\langle n\\lvert V\\rvert m\\rangle\\langle m\\lvert V\\rvert 0\\rangle}{(E_0 - E_n)(E_0 - E_m)}\\lvert n\\rangle\\\\ &= \\sum_{n\\neq 0}\\sum_{m\\neq 0}\\frac{\\lvert n\\rangle\\langle n\\lvert V\\rvert m\\rangle\\langle m\\lvert V\\rvert 0\\rangle}{(E_n - E_0)(E_m - E_0)} \\\\ &= \\left(\\sum_{n\\neq 0}\\frac{\\lvert n\\rangle\\langle n\\rvert}{E_n - E_0}\\right) V \\left(\\sum_{m\\neq 0}\\frac{\\lvert m\\rangle\\langle m\\rvert}{E_m - E_0}\\right) V\\lvert 0\\rangle\\\\ &= RVRV\\lvert 0\\rangle. \\end{aligned} 2. 化简第二项 注意 \\langle 0\\lvert V\\rvert 0\\rangle=E^{(1)} 是常数，可提到求和号外；把 \\lvert n\\rangle 挪到 \\langle n\\lvert V\\rvert 0\\rangle 左侧，并利用 (E_0 - E_n)^2=(E_n - E_0)^2 与式 预解算符平方（式 2）： \\begin{aligned} &-\\sum_{n\\neq 0}\\frac{\\langle 0\\lvert V\\rvert 0\\rangle\\langle n\\lvert V\\rvert 0\\rangle}{(E_0 - E_n)^2}\\lvert n\\rangle \\\\ &= -E^{(1)}\\left(\\sum_{n\\neq 0}\\frac{\\lvert n\\rangle\\langle n\\rvert}{(E_n - E_0)^2}\\right)V\\lvert 0\\rangle \\\\ &= -E^{(1)}R^2V\\lvert 0\\rangle. \\end{aligned} 3. 代入一阶波函数 由于 RV\\lvert 0\\rangle=-\\lvert \\psi_1\\rangle，直接代入上面两项末尾的 RV\\lvert 0\\rangle： \\begin{aligned} \\lvert \\psi_2\\rangle &= RV\\big(RV\\lvert 0\\rangle\\big) - E^{(1)}R\\big(RV\\lvert 0\\rangle\\big) \\\\ &= RV(-\\lvert \\psi_1\\rangle) - E^{(1)}R(-\\lvert \\psi_1\\rangle) \\\\ &= -RV\\lvert \\psi_1\\rangle + E^{(1)}R\\lvert \\psi_1\\rangle. \\end{aligned} 公式速查表汇总了一至三阶的常用公式，记 V_{nm}=\\langle n\\lvert V\\rvert m\\rangle。表中的波函数修正采用中间归一化。 教材显式求和与预解算符写法对照 物理量 量子力学教材显式求和写法 预解算符 R 紧凑写法 一阶能量 E^{(1)} \\langle 0\\lvert V\\rvert 0\\rangle \\langle 0\\lvert V\\rvert 0\\rangle 一阶波函数 \\lvert \\psi_1\\rangle \\displaystyle\\sum_{n\\neq 0}\\frac{\\langle n\\lvert V\\rvert 0\\rangle}{E_0 - E_n}\\lvert n\\rangle -RV\\lvert 0\\rangle 二阶能量 E^{(2)} \\displaystyle\\sum_{n\\neq 0}\\frac{\\lvert\\langle n\\lvert V\\rvert 0\\rangle\\rvert^2}{E_0 - E_n} -\\langle 0\\lvert VRV\\rvert 0\\rangle 二阶波函数 \\lvert \\psi_2\\rangle \\displaystyle\\sum_{n,m\\neq 0}\\frac{V_{nm}V_{m0}}{(E_0-E_n)(E_0-E_m)}\\lvert n\\rangle-\\sum_{n\\neq 0}\\frac{V_{00}V_{n0}}{(E_0-E_n)^2}\\lvert n\\rangle RVRV\\lvert 0\\rangle-E^{(1)}R^2V\\lvert 0\\rangle 三阶能量 E^{(3)} \\displaystyle\\sum_{n,m\\neq 0}\\frac{V_{0n}V_{nm}V_{m0}}{(E_0-E_n)(E_0-E_m)}-V_{00}\\sum_{n\\neq 0}\\frac{\\lvert V_{n0}\\rvert^2}{(E_0-E_n)^2} \\langle 0\\lvert VRVRV\\rvert 0\\rangle-E^{(1)}\\langle 0\\lvert VR^2V\\rvert 0\\rangle 多体系统中的实际优势与 BWPT 对比 算符期望值计算与非连通体相激发的自然抵消 采用中间归一化后，\\hat{O} 的精确基态期望值可以写成分子与范数平方的比值。 \\begin{aligned} \\langle\\hat{O}\\rangle &= \\frac{\\langle \\widetilde{\\Psi}\\lvert \\hat{O}\\rvert \\widetilde{\\Psi}\\rangle}{\\langle \\widetilde{\\Psi}\\vert \\widetilde{\\Psi}\\rangle}\\\\ &= \\frac{M_0+\\lambda M_1+\\lambda^2 M_2+O(\\lambda^3)} {1 + \\lambda^2\\langle \\psi_1\\vert \\psi_1\\rangle + O(\\lambda^3)}. \\end{aligned} 取 \\hat{O} 为厄米算符，分子的各阶系数可用复共轭项 \\text{c.c.} 简写。 \\begin{aligned} M_0 &= \\langle 0\\lvert \\hat{O}\\rvert 0\\rangle,\\\\ M_1 &= \\langle 0\\lvert \\hat{O}\\rvert \\psi_1\\rangle+\\text{c.c.},\\\\ M_2 &= \\langle 0\\lvert \\hat{O}\\rvert \\psi_2\\rangle+\\text{c.c.}\\\\ &\\quad +\\langle \\psi_1\\lvert \\hat{O}\\rvert \\psi_1\\rangle. \\end{aligned} 在多体晶格模型中，若某些虚激发与观测区域分离，且它们的贡献能与观测区域的矩阵元因子化，这些非连通贡献就会在分子和分母中逐阶抵消。例如，若二阶体相贡献在两处都给出因子 1+\\lambda^2\\sum_{b\\in\\text{bulk}}\\lvert c_b\\rvert^2（c_b 为相应虚激发的一阶振幅），保留到二阶时这个因子就会约去。对于子区域无序算符 \\hat{U}_M(\\theta)，需根据具体模型和算符的空间支撑判断哪些贡献满足这一条件。 与布里渊–维格纳微扰论对比 布里渊–维格纳微扰论（Brillouin–Wigner perturbation theory, BWPT）把未知的精确能量 E 留在分母里。以下逆算符在 Q 子空间上取逆。将方程形式迭代，得到 \\begin{aligned} \\lvert \\widetilde{\\Psi}\\rangle &= \\lvert 0\\rangle + \\frac{Q}{E - H_0}\\lambda V\\lvert \\widetilde{\\Psi}\\rangle \\\\ &= \\lvert 0\\rangle + \\sum_{k=1}^\\infty \\left(\\frac{Q}{E - H_0}\\lambda V\\right)^k\\lvert 0\\rangle, \\\\ E &= E_0 + \\lambda\\langle 0\\lvert V\\rvert \\widetilde{\\Psi}\\rangle. \\end{aligned} BWPT 的递推式把能量修正隐含在 E-E_n 中。常规 BWPT 在有限阶截断时一般不保证广延性，例如独立子系统的能量修正未必能直接相加。RSPT 与 BWPT 对照表汇总了两种写法的差异。 瑞利–薛定谔与布里渊–维格纳微扰论对照 对比维度 瑞利–薛定谔微扰论（RSPT） 布里渊–维格纳微扰论（BWPT） 能量分母 已知未扰能量 E_n - E_0 未知精确能量 E - E_n（需自洽求解） 高阶表达式 出现 E^{(1)}, E^{(2)} 等扣除项 通过含 E 的分母自洽求解 \\lambda 的幂级数 显式按 \\lambda^k 严格展开 分母隐含 \\lambda，非显式幂级数 多体广延性 逐阶保持独立子系统能量的可加性 常规有限阶截断一般不保证广延性 典型适用场景 凝聚态多体晶格、量子化学、场论微扰 少体问题、近简并有效哈密顿量构造 参考资料 Barton Zwiebach，《Quantum Physics III》第 1 章，定态微扰论及一、二阶修正。MIT 课程讲义 Erwin Schrödinger，〈Quantisierung als Eigenwertproblem (Dritte Mitteilung)〉，1926。原始论文 Kevin Carter-Fenk 与 Martin Head-Gordon，常规 BWPT 的广延性限制及二阶改进，2023。原始论文"},{"href":"posts/2026-10-31-cold-atom-review-map.html","kind":"article","title":"冷原子综述全图：139 篇，按实验形态分八类","date":"2026-10-31","dateText":"2026年10月31日","scope":"category:research","cat":"研究笔记","section":"literature","sectionName":"文献阅读与综述","sectionHref":"categories/research.html#type-literature","sectionOrder":2,"headings":[{"id":"为什么按实验形态分类","label":"为什么按「实验形态」分类"},{"id":"还能怎么用","label":"还能怎么用"},{"id":"三条必须说清楚的边界","label":"三条必须说清楚的边界"},{"id":"一句话","label":"一句话"}],"tags":["冷原子","综述","里德堡","文献整理"],"summary":"2000–2026 年冷原子方向的 139 篇综述，按实验形态分八类，附 12 个技术要素交叉索引、时间分布和必读 15 篇。","text":"📄 这是导读。可检索、带分类卡片、时间分布柱状图和 15 个锚点目录的完整报告见专题页：《冷原子综述全图（2000–2026）》。 为什么按「实验形态」分类 冷原子文献的标题里塞满了 BEC、简并费米气、光晶格、光镊、里德堡、光钟这些词，用关键词搜是一团乱麻。这份汇总换了个切法：先问「原子是怎么被抓住、怎么被读出来的」，再往下分。 类别 条数 一句话 A 系综 / 体量子气体 42 一个宏观系综共享同一外场，整体读一个信号 B 光晶格 18 周期性势场、Hubbard、量子气体显微镜、拓扑带 C 单原子阵列 / 光镊 / 里德堡 18 每个原子是一个可单独寻址的比特 D 精密测量 20 光钟、原子干涉、里德堡电场与微波传感 E 腔 QED 11 腔与原子的量子接口、量子网络、量子存储 F 冷分子 / 少体 / 碰撞 18 超冷分子、Feshbach、光缔合、Efimov G 冷却技术 7 磁微阱、单原子探测、微加工器件 H 路线图 / 方法学 5 路线图、可信任性讨论、绝热捷径 分成八类之后，一篇综述放在哪一格基本没有歧义；同一个组在不同格子里的工作也能顺着看出来了。 还能怎么用 12 个技术要素交叉索引：光镊、里德堡、成像读出、纠错、光晶格 Hubbard 这些标签横跨八个类别，适合从「我想找某个技术」倒着查。 时间分布：哪些年份是综述爆发期，一眼能看出来。 必读 15 篇：按引用排的前 15 篇，附第一作者单位和前三位作者（鼠标悬停看全名单）。 每条都给了 DOI 或 arXiv 链接，能直接点开核对，不用信我的话。 三条必须说清楚的边界 八个类别和 12 个技术标签是机器按标题关键词规则归的，不是人工逐篇判读。边界个例（比如介于晶格和阵列之间的工作）可能有归类偏差。 数据源是 Crossref、DataCite、OpenAlex。中文期刊在 Crossref 覆盖不全，实际只捞到 11 篇中文综述，CNKI、万方这类库够不到，所以中文文献这块是明显缺口。 Nature/Science 的短篇 Perspective 没法和普通论文从元数据上区分，可能有遗漏。 一句话 这份东西的价值不在于「清单很全」，而在于把 139 篇综述塞进了一个有坐标的格子里——想找某个方向先看哪几篇，比按关键词搜省事得多。 统计口径：原始候选 3917 条 → 冷原子相关 199 条 → 严格综述 129 条（v1）→ 剔除 16 条同词噪声、补入 26 条 → 139 条（v2）。来源构成：期刊综述 101、中文综述 11、AAMOP 专著章节 10、arXiv 17。"},{"href":"posts/2026-10-30-hello-blog.html","kind":"article","title":"建一个自己的博客，从今天开始","date":"2026-10-30","dateText":"2026年10月30日","scope":"category:essay","cat":"随笔感想","section":"blog","sectionName":"博客与写作","sectionHref":"categories/essay.html#type-blog","sectionOrder":0,"headings":[{"id":"为什么突然想写博客","label":"为什么突然想写博客"},{"id":"这套博客是怎么运转的","label":"这套博客是怎么运转的"},{"id":"写一篇新文章有多麻烦","label":"写一篇新文章有多麻烦"},{"id":"一点私心","label":"一点私心"}],"tags":["博客","建站","开始"],"summary":"折腾了一个晚上，把博客搭起来了。记录一下为什么想写，以及这套东西是怎么运转的。","text":"为什么突然想写博客 一直以来，读过的东西都散落在收藏夹、微信文件传输助手、还有各种莫名其妙的临时文档里。过三个月回头找，基本等于丢了。 所以想要一个地方： 把读完一篇论文之后的思考留下来，而不只是收藏链接； 把工作里踩过的坑写下来，下次别踩第二遍； 偶尔写点跟工作无关的东西，证明自己还活着。 这套博客是怎么运转的 整个站点只有三个部分： content/posts/ 里放 Markdown 文件 —— 一篇文章就是一个 .md； 一条命令 node build.mjs，把 Markdown 编译成静态网页，输出到 docs/； 把 docs/ 提交推送，GitHub Pages 就会自动发布。 没有数据库，没有后台，不需要服务器。文章本质上是纯文本文件，二十年后的软件大概都还读得懂。 写一篇新文章有多麻烦 不麻烦，三步： # 1. 新建一个文件，文件名就是网址 # content/posts/2026-11-01-my-first-post.md # 2. 写上开头这几行（frontmatter） # --- # title: 标题 # date: 2026-11-01 # category: work # tags: [标签1, 标签2] # summary: 一句话摘要，会显示在列表里 # --- # 3. 重新构建 node build.mjs 就这些。剩下的排版、目录、标签页、RSS、搜索，构建脚本会自己搞定。 一点私心 我挺喜欢这种「内容就是文件」的感觉。它不会因为我换了一台电脑、换了一个平台、或者某个服务停止运营而消失。 写下来，就算数。"},{"href":"posts/2026-10-30-neutral-atom-companies.html","kind":"article","title":"全球原子体系量子计算公司图谱 v2","date":"2026-10-30","dateText":"2026年10月30日","scope":"category:research","cat":"研究笔记","section":"industry","sectionName":"产业调研","sectionHref":"categories/research.html#type-industry","sectionOrder":3,"headings":[{"id":"收录与排除口径","label":"收录与排除口径"},{"id":"一a4科技巨头3-家全部官网证实","label":"一、A4：科技巨头（3 家，全部官网证实）"},{"id":"二a1光镊-里德堡门15-家","label":"二、A1：光镊 + 里德堡门（15 家）"},{"id":"中国6-家官网已证实","label":"中国（6 家，官网已证实）"},{"id":"美国3-家","label":"美国（3 家）"},{"id":"欧洲-中东-日本6-家","label":"欧洲 / 中东 / 日本（6 家）"},{"id":"三a2光晶格1-家","label":"三、A2：光晶格（1 家）"},{"id":"补充超冷原子-光晶格方向的中国公司","label":"补充：超冷原子 / 光晶格方向的中国公司"},{"id":"四a3中性原子核自旋1-家","label":"四、A3：中性原子核自旋（1 家）"},{"id":"五a-类候选官网未获取2-家不计入正式-a-类","label":"五、A 类候选：官网未获取（2 家，不计入正式 A 类）"},{"id":"六b-类中性原子-里德堡但做传感时钟射频5-家","label":"六、B 类：中性原子 / 里德堡，但做传感·时钟·射频（5 家）"},{"id":"七c-类非本路线-外围-非公司实体","label":"七、C 类：非本路线 / 外围 / 非公司实体"},{"id":"八明确排除做过核对结论无原子体系路线","label":"八、明确排除（做过核对，结论：无原子体系路线）"},{"id":"九本轮补扫  明确排除清单 无 有（IBM/Intel/IonQ 等，附理由） 未完成项 笼统写「有界枚举」 逐条列出 + 原因，补扫后再更新 核心补正：Google 的中性原子路线是 v1 最严重的遗漏——它是超导巨头正式宣布双线，这类「大厂转向/扩张」信号比初创名单更有情报价值。 调研与核验：2026-10-30｜通道：本机 Chrome (CDP 9333) + Bing"},{"href":"posts/2026-10-28-neutral-atom-note.html","kind":"article","title":"中性原子路线，为什么值得持续盯住","date":"2026-10-28","dateText":"2026年10月28日","scope":"category:research","cat":"研究笔记","section":"ideas","sectionName":"研究思考","sectionHref":"categories/research.html#type-ideas","sectionOrder":4,"headings":[{"id":"为什么是中性原子","label":"为什么是中性原子"},{"id":"工程上卡在哪","label":"工程上卡在哪"},{"id":"我关心的几个问题","label":"我关心的几个问题"},{"id":"接下来","label":"接下来"}],"tags":["量子计算","中性原子","笔记"],"summary":"整理了最近关于中性原子量子计算的一些零散思考：它的优势到底在哪，工程上的难点又卡在哪里。","text":"这是一篇示例文章，用来演示排版效果。把 content/posts/ 里的内容换成你自己的即可。 为什么是中性原子 如果把量子计算的各种物理实现路线摊开看，中性原子是那种「参数看起来最不讲道理」的一条： 原子是天然的：每个原子都是全同的，不存在制造公差； 阵列可以长得很大：用光镊（optical tweezer）一排排「抓」住原子，做成二维甚至三维的阵列； 连接不局限于近邻：通过里德堡激发，可以让相隔很远的原子产生强相互作用，这在拓扑上非常划算。 这三点合起来意味着：比特数量、连接度、以及相干性，都有机会同时做得不错。 工程上卡在哪 纸面上漂亮，落地要解决的事情一样不少： 原子丢失（atom loss）—— 光镊里的原子会跑掉，需要实时检测和重排； 里德堡态的寿命 —— 强相互作用很美妙，但激发态的寿命是硬约束； 激光系统的复杂度 —— 每一条光路都是钱和稳定性； 错误率 —— 双比特门保真度要往上顶，才能谈纠错。 我关心的几个问题 问题 为什么重要 阵列规模能到多少 决定能不能跑有意义的算法 逻辑比特的盈亏平衡点 纠错能不能真正开始「赚」 系统级稳定性 能不能连续跑一整天不出岔子 成本曲线 决定它是不是只有实验室能玩 接下来 打算按公司逐个做调研页，把每家的技术路线、团队背景、公开进展整理成独立的专题页 —— 就是站里「专题」那个板块。 写调研的一个好处是：逼自己把模糊的印象变成可以核对的说法。"},{"href":"posts/2026-10-28-rydberg-two-qubit-gates.html","kind":"article","title":"里德堡原子两比特门：实验进展与实现细节（2010–2026）","date":"2026-10-28","dateText":"2026年10月28日","scope":"category:research","cat":"研究笔记","section":"experiment","sectionName":"实验进展","sectionHref":"categories/research.html#type-experiment","sectionOrder":1,"headings":[{"id":"0-先看结论","label":"§0 · 先看结论"},{"id":"1-物理机制三种耦合方式","label":"§1 · 物理机制：三种耦合方式"},{"id":"11-阻塞blockade几乎所有门都用这个","label":"1.1 阻塞（blockade）——几乎所有门都用这个"},{"id":"12-缀饰dressing不激发到里德堡只沾一点","label":"1.2 缀饰（dressing）——不激发到里德堡，只“沾一点”"},{"id":"13-偶极交换未来的天然-iswap","label":"1.3 偶极交换——未来的“天然 iSWAP”"},{"id":"2-门协议谱系","label":"§2 · 门协议谱系"},{"id":"21-串行 ,"label":"2026 · Harvard（Lukin）· Evered 等：99.854%，71 ns，10 小时不重标 · arXiv:2604.25987"},{"id":"其他值得知道的工作不完全清单","label":"其他值得知道的工作（不完全清单）"},{"id":"5-三条硬件路线横向对比","label":"§5 · 三条硬件路线横向对比"},{"id":"6-保真度演进","label":"§6 · 保真度演进"},{"id":"7-瓶颈与-999-的路径","label":"§7 · 瓶颈与 99.9% 的路径"},{"id":"71-现在到底卡在哪","label":"7.1 现在到底卡在哪"},{"id":"72-三条被论文明确写出的改进路径","label":"7.2 三条被论文明确写出的改进路径"},{"id":"73-从门到系统","label":"7.3 从门到系统"},{"id":"8-参考文献","label":"§8 · 参考文献"}],"tags":["里德堡","两比特门","量子计算"],"summary":"门协议谱系、误差通道量级与十余篇实验细节，附三条硬件路线对比、保真度演进与通往 99.9% 的路径。","text":"📄 这是文字版，方便检索与订阅。带图表和完整排版的报告见专题页：《两比特门》。 §0 · 先看结论 一句话：里德堡两比特门的物理内核是“当一个原子被激发到里德堡态时，邻居的双激发被能量偏移封死”，由此把一束全局激光变成条件操作。所有实验差异，本质上是三件事的组合：用什么原子/什么激发路径、用几个脉冲、错误怎么被压下去。 门不是靠“对准某个原子”实现的，绝大多数现代方案用一束打整片阵列的里德堡激光，靠原子间距（是否落在 blockade 半径内）决定谁和谁纠缠。只有早期的寻址方案（Cs 那批）需要逐个原子打光。 保真度演进大致是：2010 年 Bell 0.58–0.75 → 2015 年 Cs 0.73 → 2019 年 0.86–0.95 → 2023 年 0.9952（Rb）→ 2025 年 0.9971（Sr）→ 2026 年 0.99854（Rb）。实测 门时间在缩短，不是变长：2019 年双脉冲方案 0.4 μs，2023 年 264 ns，2026 年 71 ns。快和准是一起进步的，因为拉比频率提高了约 5 倍。 现在的主要误差已经不是“门协议不好”，而是原子损失（loss）和里德堡态寿命。2026 年哈佛的数据里 loss 占全部误差的 ~60%。这直接催生了“把 loss 当 erasure 用”的纠错路线。 门保真度和“测出来的保真度”是两件事。2025 年 Caltech 明确指出：全局 randomized benchmarking 测的是对称子空间的平均保真度 F_{\\mathrm{Sym}}，不是全空间 Haar 平均 F_{\\mathrm{Haar}}；在 Rydberg 衰变主导时两者可差 12%（极端情况下差 50%）。读论文里的“99.x%”必须看它用的什么基准。 数值标注约定：本文件中 实测 = 论文报告的实验测量值；换算 = 由论文给出的参数直接推算（如门时间 = 无量纲门时长 ÷ 拉比频率）；估计 = 作者自己的外推/理论预测。凡是我无法从原文核实的，会在正文里写明“未读到原文”。 §1 · 物理机制：三种耦合方式 1.1 阻塞（blockade）——几乎所有门都用这个 两个原子都激发到里德堡态 \\lvert rr\\rangle 时，范德瓦尔斯相互作用给这对态一个能量偏移 B = \\frac{C_6}{R^6} 若 B \\gg \\Omega（\\Omega 为基态↔里德堡的拉比频率），则 \\lvert rr\\rangle 被移出共振，双激发被禁止。定义阻塞半径 R_b = \\left(\\frac{C_6}{\\Omega}\\right)^{1/6}：间距小于 R_b 的两个原子构成一个“超级原子”，集体态 \\lvert W\\rangle = \\frac{\\lvert 1r\\rangle + \\lvert r1\\rangle}{\\sqrt{2}} 与 \\lvert 11\\rangle 耦合，拉比频率被增强 \\sqrt{2} 倍。这个 \\sqrt{2} 就是两比特门里唯一的非线性来源： 单个原子（控制原子在 \\lvert 0\\rangle，目标原子在 \\lvert 1\\rangle）：以 \\Omega 振荡，周期 \\frac{2\\pi}{\\Omega}； 两个原子都在 \\lvert 1\\rangle：以 \\sqrt{2}\\,\\Omega 振荡，周期 \\frac{2\\pi}{\\sqrt{2}\\,\\Omega}。 所有 CZ 协议都是在设计脉冲，让这两种情形在末态回到各自的初态、但积累不同的相位。 当间距变近，vdW 可能不够用，或 Rydberg 态之间存在近简并的 \\lvert r'r'\\rangle，就进入 Förster 共振区，相互作用是共振偶极-偶极（\\propto \\frac{1}{R^3}）。此时不能用单一 B 描述，门保真度有更严格的界：2026 年 Norrell/Saffman 给出 F \\le 1 - \\frac{\\pi}{2V\\tau_R}（V 为相互作用强度，\\tau_R 为里德堡寿命），并构造了在大 \\Omega 极限下饱和该界的协议。 1.2 缀饰（dressing）——不激发到里德堡，只“沾一点” 把 \\lvert 1\\rangle 与 \\lvert r\\rangle 大失谐耦合（\\Delta \\gg \\Omega），基态获得一个微小的里德堡成分，两个原子之间产生有效条件能移 \\propto \\frac{\\Omega^4}{\\Delta^3}\\cdot\\frac{1}{R^6}。好处是没有真实布居在里德堡态，自发辐射和 loss 都小；坏处是能移小、门慢（微秒到几十微秒），且对光强噪声敏感。Jau 等人 2016 年的“微波驱动自旋翻转阻塞”（spin-flip blockade，Cs 钟态，Nat. Phys. 12, 71）属于这一族；本文未读该文原文，只按后续文献的引用描述，不给具体参数。 1.3 偶极交换——未来的“天然 iSWAP” 把两个原子激发到一对近简并的里德堡态（\\lvert rr\\rangle 与 \\lvert r'r'\\rangle），共振偶极交换可以把激发在原子间来回传递。这条路线的吸引力是门可以远快于 vdW 门，且天然给出 iSWAP/交换门；难点是需要精确控制直流电场把 Förster 缺陷调到零，且对间距极敏感。2025 年 Ildefonso 等（arXiv:2512.05037）给出 Cs 的数值方案，目前仍是方案，不是实验记录。 §2 · 门协议谱系 记住一个共同起点：1999–2000 年 Jaksch 等提出 \\pi \\; \\text{– gap –} \\; 2\\pi \\; \\text{– gap –} \\; \\pi 的串行方案（PRL 85, 2208）。之后所有协议都在回答同一个问题：能不能不用逐原子寻址、并且更快更稳？ 2.1 串行 π–2π–π（2010–2019 的主流） 控制原子打 \\pi 脉冲进 \\lvert r\\rangle → 目标原子打 2\\pi 脉冲：若控制在 \\lvert 0\\rangle，目标以 \\Omega 走完整 2\\pi，回到 \\lvert 1\\rangle 并积累 −1；若控制在 \\lvert 1\\rangle，blockade 使该跃迁失谐 B，2\\pi 脉冲几乎无效果 → 控制再打 \\pi 脉冲回 \\lvert 0\\rangle。结果是一个 CZ（差一个单比特相位）。 优点：每个原子单独寻址，不依赖全局光束的均匀性；用现有声光偏转器就能扫多个站点。 缺点：总时长 \\sim 4\\pi/\\Omega 再加两段 gap；控制原子要在 \\lvert r\\rangle 里等整个 2\\pi 脉冲 + 两次 gap 的时间，里德堡寿命和运动退相干直接在 gap 里累积；三束脉冲各自的强度/相位误差独立叠加。 实测例子：Wilk 2010（Paris，200 ns 完成纠缠）、Isenhower 2010（Wisconsin，首个 CNOT）、Maller 2015（Cs 2D 阵列）、Graham 2019（121 站点，t_\\pi=150\\,\\mathrm{ns}，t_{2\\pi}=220\\,\\mathrm{ns}，gap=300 ns） 2.2 双全局脉冲（2019，哈佛 Levine） 只用两束全局里德堡脉冲，长度同为 \\tau、失谐同为 \\Delta，第二束相对第一束跳一个相位 \\xi： \\lvert 00\\rangle：两束都不耦合，不动。 \\lvert 01\\rangle/\\lvert 10\\rangle：单原子二能级，Rabi \\Omega、失谐 \\Delta，第一束走“不完整振荡”，第二束绕另一个轴把它转回初态，积累 \\phi_{01}。 \\lvert 11\\rangle：集体态以 \\sqrt{2}\\,\\Omega 振荡，第一束走完一个完整失谐 Rabi 周期，第二束再走一个完整周期，积累 \\phi_{11}。 取 \\Delta \\approx 0.377\\,\\Omega 时满足 \\phi_{11} = 2\\phi_{01} - \\pi，即标准 CZ。总时长 2\\tau \\approx \\frac{2.732\\pi}{\\Omega}，比串行方案快约 1.5 倍，且完全不需要逐点寻址——这是可扩展性的关键一步。实验上要把里德堡光对超精细态的光移用自旋回波抵消，再加一段短光移脉冲消掉单比特相位。 2.3 单脉冲最优控制（2022 起，成为主流） Jandura & Pupillo（Quantum 6, 712, 2022）用最优控制找到在 blockade 区实现 CZ 的时间最优单脉冲：固定幅度、相位随时间变化。哈佛把它参数化成一条极简单的解析曲线： \\phi(t) = A\\cos(\\omega t - \\phi_0) + \\delta_0 t，一组解为 A = 2\\pi \\times 0.1122，\\omega = 1.0431\\,\\Omega，\\phi_0 = -0.7318，\\delta_0 = 0，总时长 \\frac{\\Omega T}{2\\pi} = 1.215（只比单原子共振 2\\pi 脉冲长 21.5%）。 后来又有“平滑幅度”版本（smooth-amplitude）：幅度也随时间变，\\frac{\\Omega_{420}(t)}{\\Omega_{1013}} = \\Omega_0 + \\Omega_1 \\operatorname{sech}^{\\alpha}(\\omega_{\\Omega}\\tau)，相位 \\delta_0\\tau + B\\tanh(\\lambda\\tau)，\\frac{\\Omega T}{2\\pi} = 1.207。它从很低的蓝光拉比频率起步，大部分时间待在暗态，因此中间态散射更小；代价是峰值拉比更高、对有限 blockade 更敏感。 为什么单脉冲更好？（1）没有 gap，里德堡态布居时间最短；（2）只有一个波形要标定，参数少、可全局优化；（3）对有限的脉冲上升时间鲁棒——哈佛的 Extended Data 显示，上升时间 0→40 ns 变化时，仍能重新找到一组参数实现精确 CZ。 2.4 暗态与绝热：把散射压下去 双光子激发经过中间态 \\lvert e\\rangle（Rb 的 6P_{3/2}），散射率 \\propto \\left(\\frac{\\Omega_b}{2\\Delta}\\right)^2。在 \\lvert\\Delta\\rvert \\gg \\lvert\\delta\\rvert,\\, \\Omega 的极限下，三能级系统可以重写成暗态/亮态基： \\lvert D\\rangle = \\frac{-\\lvert 1\\rangle + \\alpha\\lvert r\\rangle}{\\sqrt{1+\\alpha^2}}，\\lvert B\\rangle = \\frac{\\alpha\\lvert 1\\rangle + \\cdots\\lvert e\\rangle + \\lvert r\\rangle}{\\sqrt{1+\\alpha^2}}，其中 \\alpha = \\frac{\\Omega_b}{\\Omega_r}。 暗态不含 \\lvert e\\rangle。关键技巧：当两光子失谐 \\delta 与中间态失谐 \\Delta 反号时，里德堡布居主要走暗态，散射被压低（哈佛 2023 的图 1b 就是这个）。进一步用平滑幅度让脉冲从 \\alpha \\ll 1 起步，几乎全程贴着瞬时暗态走——数值上散射比时间最优门再低 1.2 倍（同长）到 2.5 倍（慢一倍）。 另一族是绝热/鲁棒脉冲：Saffman 的对称 CZ（两个原子同时走绝热脉冲，PRR 2, 033019 配套分析）、Fromonteil/Bluvstein/Pichler 的准静态误差鲁棒脉冲族（PRX Quantum 4, 020335）、Beterov 2026 的反绝热驱动对称 CZ（arXiv:2510.04766）、以及 Endres 组 2026 提出的“让两个量子比特态都参与门”的失谐鲁棒构造（arXiv:2608.27426，把 Stark 光移误差转成单比特相位或直接抵消）。 2.5 多比特与缀饰 原生 CCZ/Toffoli：把三个原子摆成三角，两个控制原子同时 blockade 中间原子。Levine 2019 用 RedCRAB 数值优化得到 CCZ，Toffoli 真值表保真度 87.0(4)%（SPAM 校正 Paris（Browaeys / Grangier）· Wilk 等：第一次用 Rydberg blockade 造出纠缠 · arXiv:0908.0454 T. Wilk, A. Gaëtan, C. Evellin, J. Wolters, Y. Miroshnychenko, P. Grangier, A. Browaeys, Entanglement of two individual neutral atoms using Rydberg blockade, PRL 104, 010502 (2010). DOI: 10.1103/PhysRevLett.104.010502 平台与配额 两个 ⁸⁷Rb 原子，各自关在 810 nm 光镊里，间距 4 μm，腰斑 0.9 μm，阱深 0.5 mK。两个光镊的光分别收进两个 APD，逐原子判存在。磁场 B=9\\,\\mathrm{G}，沿两原子连线，定义量子化轴。原子温度 60 μK。 编码与制备 编码在两个超精细基态：\\lvert\\uparrow\\rangle = \\lvert 5s_{1/2}, F=2, M=2\\rangle，\\lvert\\downarrow\\rangle = \\lvert 5s_{1/2}, F=1, M=1\\rangle，劈裂 6.8 GHz。里德堡态选 \\lvert r\\rangle = \\lvert 58d_{3/2}, F=3, M=3\\rangle——注意选 d 态而不是 s 态，是为了借 Förster 共振把相互作用放大：4 μm 处计算得到的相互作用能 \\frac{\\Delta E}{h} \\approx 50\\,\\mathrm{MHz}。 激发方案与门（关键：这不是 CZ 门，是“W 态制备 + 映射”） 两步双光子： \\lvert \\uparrow\\rangle → \\lvert r\\rangle：795 nm（\\pi 偏振） + 475 nm（\\sigma^+），795 从 5p_{1/2}(F=2) 蓝失谐 600 MHz 以压自发辐射。测得单原子双光子 \\frac{\\Omega_{\\uparrow r}}{2\\pi} \\approx 6\\,\\mathrm{MHz}（475 nm 功率 30 mW、腰 25 μm；795 nm 15 mW、腰 130 μm）。 \\lvert r\\rangle → \\lvert \\downarrow\\rangle：同一束 475 nm + 第二束 795 nm（偏振垂直于量子化轴，频率高 6.8 GHz），\\frac{\\Omega_{r\\downarrow}}{2\\pi} \\approx 5\\,\\mathrm{MHz}。两束 795 nm 互相锁相，也能做基态间的拉曼旋转。 序列：先打 \\frac{\\pi}{\\sqrt{2}\\,\\Omega_{\\uparrow r}} \\approx 70\\,\\mathrm{ns}，从 \\lvert \\uparrow \\uparrow\\rangle 制备 W 态 \\frac{\\lvert r,\\uparrow\\rangle + \\lvert\\uparrow,r\\rangle}{\\sqrt{2}}（\\sqrt{2} 来自集体增强，这就是 blockade 的直接证据）；再打 \\frac{\\pi}{\\Omega_{r\\downarrow}} \\approx 110\\,\\mathrm{ns} 把 \\lvert r\\rangle 映射到 \\lvert \\downarrow\\rangle，加上 30 ns 间隔，总 ~200 ns。整个过程关掉光镊（否则里德堡态被反阱踢走）。产物是 Bell 态 \\frac{\\lvert\\downarrow\\uparrow\\rangle + e^{i\\phi}\\lvert\\uparrow\\downarrow\\rangle}{\\sqrt{2}}，\\phi 由两束光的波矢差和原子位置决定，同向传播时 \\phi \\approx 0。 测量 读出靠“推走”技术：D2 线 F=2 \\to F=3 共振光把 \\lvert \\uparrow\\rangle 弹出阱，留在阱里的就是 \\lvert \\downarrow\\rangle。因为分不清“\\lvert \\uparrow\\rangle”和“丢原子”，他们另做一次不推开光的实验测剩余对概率 p_{\\mathrm{recap}} = 0.62(3)，只对剩下的对算保真度。相干性通过全局拉曼旋转（相位逐发随机、最后对 2\\pi 平均）从 P_{11}(\\theta) 里提取。 结果与误差 剩余对：61%，保真度 F_{\\mathrm{pairs}} = 0.75(7) 实测 损失：每个原子 0.22(1)，总损失 0.39(2)。来源：中间态自发辐射落到 \\lvert \\downarrow\\rangle（~7%）、激发/映射光强噪声 5% 与频率噪声 3 MHz（~7%）、关阱期间 ~3%、探测 ~3% 主要误差：（1）blockade 不完全，~10% 概率双激发 → 映射成 \\lvert \\downarrow \\downarrow\\rangle，直接看到非零 \\rho_{\\downarrow\\downarrow}=0.06；（2）自发辐射与激发不完美导致 \\rho_{\\uparrow\\uparrow}=0.09 偏大；（3）运动：60 μK 下自由飞行，相位扩散 \\langle e^{i\\phi}\\rangle = 0.94，理论上限 0.97。用 600 ns 间隔重做，相干项掉一半，与模型 0.45 一致——温度就是当时的最终限制 历史位置：同月 Wisconsin 组（Isenhower 等）用 CNOT 得到类似结论，两篇背靠背发在 PRL 104。这一对论文把“Rydberg 门”从理论变成实验。 2010 · Wisconsin（Saffman）· Isenhower 等：第一个中性原子 CNOT · arXiv:0907.5552 L. Isenhower, E. Urban, X. L. Zhang, A. T. Gill, T. Henage, T. A. Johnson, T. G. Walker, M. Saffman, Demonstration of a neutral atom controlled-NOT quantum gate, PRL 104, 010503 (2010). DOI: 10.1103/PhysRevLett.104.010503 实现 两个 ⁸⁷Rb 原子关在间距 >8 μm 的光阱里，用 Rydberg blockade 实现 CNOT。他们比较了两种门协议，测得 CNOT 保真度 F=0.73 与 0.72 实测；用宇称振荡证明生成的态越过纠缠阈值（0.5）。 局限 8 μm 间距意味着 blockade 很弱，必须靠低激发态或慢脉冲凑相位；单原子寻址、关阱损失、里德堡寿命共同限制在 ~0.7。同组的 Zhang 等（PRA 82, 030306(R), arXiv:1007.0397）用同一平台得到 F=0.58\\pm0.04，扣除背景碰撞损失后 0.71±0.05，并给出详细误差模型。 注：本文我只读到摘要级信息（PDF 抓取失败），具体脉冲参数未取；如需可再补。 2015 · Wisconsin（Saffman）· Maller 等：2D 阵列 + 把 AC Stark 相位讲清楚 · arXiv:1506.06416 K. M. Maller, M. T. Lichtman, T. Xia, Y. Sun, M. J. Piotrowicz, A. W. Carr, L. Isenhower, M. Saffman, A Rydberg blockade CNOT gate and entanglement in a 2D array of neutral atom qubits, PRA 92, 022336 (2015). DOI: 10.1103/PhysRevA.92.022336 平台与配额 Cs 原子，7×7 = 49 站点的蓝失谐光阱阵列（64 束 780 nm 弱重叠聚焦光），间距 3.8 μm，装载率 ~60%。量子比特 \\lvert 0\\rangle = \\lvert 6s_{1/2}, f=3, m_f=0\\rangle、\\lvert 1\\rangle = \\lvert 6s_{1/2}, f=4, m_f=0\\rangle。全局单比特门用 9.2 GHz 微波；单点操作用一束对 7p_{1/2} 失谐 −14 GHz 的聚焦光，在单点产生 ~40 kHz 差分 Stark 移（与 2015 年那篇单比特门论文同一套寻址机制，但这里反过来用：把不想转的站点推出共振）。 激发方案 459 nm（\\sigma^+）+ 1038 nm（\\sigma^-）双光子，经 7p_{1/2}，里德堡态 \\lvert 82s_{1/2}, m_j=-1/2\\rangle，中间态失谐 \\Delta_1=2\\pi\\times 0.83\\,\\mathrm{GHz}。两束光分别用交叉 AOM 做二维扫描，腰斑 3.0 / 3.7 μm，站点切换时间 ~0.5 μs，偏置磁场 0.15 mT 垂直于阵列平面。脉冲是方波，上升/下降 ~50 ns；1038 nm 比 459 nm 多开 50 ns，让精确脉宽由 459 nm 控制。 这一篇真正的贡献：AC Stark 相位分析 他们指出双光子激发下，即使 blockade 完美，门矩阵也不是理想 CZ，而是 \\mathrm{CZ}_{\\bar{\\phi}} = \\operatorname{diag}\\!\\left(e^{i\\phi_{00}}, e^{i\\phi_{01}}, e^{i\\phi_{10}}, e^{i\\phi_{11}}\\right)。只有 \\phi_{00}-\\phi_{01}-\\phi_{10}+\\phi_{11} \\ne 2\\pi n 时才能产生纠缠。三个相位来源被逐项写出： 2\\pi 脉冲的量子相位：单光子情形恒为 \\pi；双光子情形可以是任意值，\\phi_R = \\pi - \\left(\\Delta^{r}_{11}+\\Delta^{\\mathrm{nr}}_{g1}+\\Delta^{\\mathrm{nr}}_{g2}\\right)\\cdot 2t_\\pi； 控制原子在 \\lvert r\\rangle 等待期间的差分光移相位 \\phi_{\\mathrm{gap}}； blockade 泄漏相位 \\phi_{\\mathrm{BL}} = \\frac{\\pi\\Omega_R}{2B}。 结论：可以选拉比频率比 q=\\left\\lvert\\frac{\\Omega_2}{\\Omega_1}\\right\\rvert 使 \\phi_R=n\\pi，再选 gap 使 \\phi_{\\mathrm{gap}}=2n'\\pi，从而恢复理想 CZ；剩余的单比特相位用全局 R_z(\\theta) 补掉。同时给出实验测 E_1、E_2 的方法（459 nm 的 Ramsey 差分 Stark 测 E_1；由 \\Omega_R 反推 E_2；再用基态–里德堡 Ramsey 交叉验证）。他们强调：光强必须准到 10% 以内，否则门相位就偏。 结果与误差 Bell 保真度：0.73 ± 0.05（不做 loss 后选择）实测；做后选择 0.79 ± 0.05 宇称振幅：0.391(6)；\\frac{P_{00}+P_{11}}{2}=0.47(2) 主要误差：残余光移、原子温度（运动导致的光移抖动与多普勒）、激发光强/相位噪声、关阱损失 历史位置：把门从“单对原子”推到 2D 阵列，并且第一次系统处理了双光子带来的 Stark 相位问题——后面所有双光子方案（Rb 420/1013、Cs 459/1038）都继承了这个分析框架。 2019 · Harvard（Lukin）· Levine 等：两束全局脉冲、并行、第一次上 95% · arXiv:1908.06101 H. Levine, A. Keesling, G. Semeghini, A. Omran, T. T. Wang, S. Ebadi, H. Bernien, M. Greiner, V. Vuletić, H. Pichler, M. D. Lukin, Parallel implementation of high-fidelity multiqubit gates with neutral atoms, PRL 123, 170503 (2019). DOI: 10.1103/PhysRevLett.123.170503 平台 ⁸⁷Rb，一维光镊阵列（实时光反馈把原子排成 2 个或 3 个一组）。编码 \\lvert 0\\rangle = \\lvert 5S_{1/2}, F=1, m_F=0\\rangle、\\lvert 1\\rangle = \\lvert 5S_{1/2}, F=2, m_F=0\\rangle。全局拉曼（795 nm，经 5P_{1/2}，强度调制器产生 ±3.42 GHz 边带）\\frac{\\Omega_{01}}{2\\pi}=250\\,\\mathrm{kHz}；单点 Z 操作用 420 nm 光聚焦到单原子产生光移（寻址串扰 \u003c2%，图 1d 实测）。 门：双全局脉冲协议 里德堡态 \\lvert r\\rangle = \\lvert 70S_{1/2}, m_J=-1/2\\rangle，420 + 1013 nm 双光子，全局耦合 \\frac{\\Omega}{2\\pi}\\approx 3.5\\,\\mathrm{MH 双光子 420 + 1013/1015 nm，n\\approx53 Levine 2019；Evered 2023（99.52%）；Evered 2026（99.854%） 最成熟；高功率 1015 nm 可得 >17 MHz；单比特门 99.99%；1.7 μm 间距下 blockade 950 MHz；可搬到 442 比特 中间态散射是硬账；双光子光移要处理；n=53 时 T_1 ~80 μs 限制寿命；需关阱 Cs 双光子 459 + 1038 nm，n=66\\text{–}82 Maller 2015（0.73）；Graham 2019（0.86/0.89） 早期主力，晶格/2D 阵列技术成熟；g 因子与波长组合灵活 同双光子问题；晶格间距偏大（3.1–3.8 μm）→ blockade 弱；温度偏高（15 μK） Sr 单光子 316.6 nm，从 {}^3\\mathrm{P}_0 Madjarov 2020（Bell ≥0.991）；Tsai 2025（0.9971） 无中间态散射；自电离探测效率 0.996+；可开阱做门；光频比特相干极好（用于钟与计量） 316.6 nm 功率是 \\Omega 瓶颈（7.7 MHz 上限）；{}^3\\mathrm{P}_0 制备慢（钟跃迁 kHz 级）；里德堡态在 813 nm 反阱 Yb 单光子 302 nm，从 {}^3\\mathrm{P}_0 Ma 2022（≈0.83）；Ma 2023（0.980） 亚稳态核自旋 T_1、T_2 达秒级；单光子快激发；里德堡衰变被离子实束缚 → 可探测 → erasure 转换 33% 亚稳态寿命 2.96 s（存储劣势）；\\Omega 只有 1.6 MHz（\\pi 330 ns），门 ~760 ns 偏慢；多普勒误差占比高 为什么 Rb 现在领先？不是因为物理更优，而是因为工程投入：高功率 1015 nm 激光 + 高 NA 物镜（1.7 μm 间距）+ 低温 + 暗态脉冲 + 快速标定（20–30 Hz 循环、40 分钟标定完）。这三件事同时做到，才有 17 MHz 的 \\Omega 和 950 MHz 的 blockade。Sr/Yb 的物理上限（无中间态散射）更高，但卡在 UV 激光功率上。 §6 · 保真度演进 工作 数值 2010 Wilk（Bell） 0.75 2010 Isenhower（CNOT） 0.73 2015 Maller（Bell） 0.73 2019 Graham（Bell） 0.86 2019 Levine（Bell 下界） 0.950 2020 Madjarov（Bell，校正） 0.991 2023 Ma（CZ） 0.980 2023 Evered（CZ，60 原子） 0.9952 2025 Tsai（CZ，对称平均） 0.9971 2026 Evered（CZ，raw） 0.99854 条形长度按“保真度 − 0.5”线性映射。注意各类指标并不完全可比：Wilk/Maller/Levine/Graham/Madjarov 是 Bell 态（或 W 态）保真度，Ma/Evered/Tsai 是 CZ 门保真度；Madjarov 是保守下界，Levine 是下界，Tsai 是对称子空间平均。不要把这些数字直接横比——这正是 §3 结尾强调的基准问题。 §7 · 瓶颈与 99.9% 的路径 7.1 现在到底卡在哪 里德堡寿命（n=53，T_1\\approx80\\,\\mu\\mathrm{s}）：每多 10 ns 门时间就多一份衰变概率。2026 年这项占 0.046%，是第二大项。 中间态散射（\\lvert 1\\rangle 0.028% + \\lvert 0\\rangle 0.018%）：唯一解是加大 \\Delta，但 \\Delta 加大就要更强激光来维持 \\Omega。这是“功率即保真度”的直接体现。 原子损失（0.087%，占 60%）：主要来自里德堡态在阱里的反阱 + 黑体/辐射衰变。已能探测（态选择性读出），可当 erasure 用，但仍是“总误差”里的最大块。 束流稳定性：1015 nm 光强 0.1% 变化、束位置几百 nm 漂移就显著掉保真度；这是长期运行的工程瓶颈（他们靠相机反馈 + 频繁重标定解决）。 并行均匀性：60→442 比特时，光束必须是平顶、且两行都均匀；好在 2023 年已证明站点间差异在统计误差内。 7.2 三条被论文明确写出的改进路径 路径 具体做法 预期 加大 \\Omega + 加大 \\Delta 更高功率 1015 nm；或用脉冲激光；同时把 n 适当降低以增大矩阵元 2023 年作者估计 3 倍 \\Omega + 2 倍 \\Delta → 99.9% 估计 压 \\lvert r'\\rangle 耦合 更强磁场（2026 年已到 13.7 G、38.5 MHz 劈裂）+ 相位 profile 精细优化 该项可压到 \u003c0.005% 估计 改善 T_2^* + 寿命 更好的光束指向稳定、更低温度、更高 n（但要权衡电场敏感度） 2026 年作者：99.9–99.95% 可达 估计 7.3 从门到系统 erasure 化：把 loss 与泄漏变成“位置已知的擦除”，是当前提升纠错阈值最有效的手段（Ma 2023 的 33% 转换、Evered 2026 的 loss 后选择 99.941%）。 非局域连接：靠原子搬运实现任意连接（Evered 2026 的非局域电路），代价是搬运时间与加热，所以门本身要快到 100 ns 量级才有意义。 多比特原生门：CCZ 只比 CZ 长 44%，对减少深度直接有用（Toffoli 分解成 6 个 CZ 不划算）。 基准标准化：SSB 与 FRT 的出现说明领域开始认真对待“保真度到底测的是什么”。跨平台比较前，先确认指标。 §8 · 参考文献 T. Wilk et al., Entanglement of two individual neutral atoms using Rydberg blockade, PRL 104, 010502 (2010). arXiv:0908.0454 · DOI 10.1103/PhysRevLett.104.010502 L. Isenhower et al., Demonstration of a neutral atom controlled-NOT quantum gate, PRL 104, 010503 (2010). arXiv:0907.5552 · DOI 10.1103/PhysRevLett.104.010503 X. L. Zhang et al., Deterministic entanglement of two neutral atoms via Rydberg blockade, PRA 82, 030306(R) (2010). arXiv:1007.0397 K. M. Maller et al., A Rydberg blockade CNOT gate and entanglement in a 2D array of neutral atom qubits, PRA 92, 022336 (2015). arXiv:1506.06416 · DOI 10.1103/PhysRevA.92.022336 H. Levine et al., Parallel implementation of high-fidelity multi-qubit gates with neutral atoms, PRL 123, 170503 (2019). arXiv:1908.06101 · DOI 10.1103/PhysRevLett.123.170503 T. M. Graham et al., Rydberg mediated entanglement in a two-dimensional neutral atom qubit array, PRL 123, 230501 (2019). arXiv:1908.06103 · DOI 10.1103/PhysRevLett.123.230501 I. S. Madjarov et al., High-fidelity entanglement and detection of alkaline-earth Rydberg atoms, Nat. Phys. 16, 857 (2020). arXiv:2001.04455 · DOI 10.1038/s41567-020-0903-z S. Ma et al., Universal gate operations on nuclear spin qubits in an optical tweezer array of ¹⁷¹Yb atoms, PRX 12, 021028 (2022). arXiv:2112.06799 · DOI 10.1103/PhysRevX.12.021028 S. Ma et al., High-fidelity gates with mid-circuit erasure conversion in a metastable neutral atom qubit, Nature 622, 279 (2023). arXiv:2305.05493 · DOI 10.1038/s41586-023- sectionHref":"categories/life.html#type-daily","sectionOrder":0,"headings":[{"id":"出门","label":"出门"},{"id":"河边","label":"河边"},{"id":"回来的时候想的事","label":"回来的时候想的事"},{"id":"这周的小事","label":"这周的小事"}],"tags":["周末","散步","照片"],"summary":"天气好得不像话，骑车去了城郊。没做什么特别的事，就是坐着看了很久的水。","text":"示例文章：生活随笔的样子。 出门 天气预报说下午转阴，结果一路都是大太阳。骑车出城大概四十分钟，人越来越少，树越来越密。 路两边是那种很普通的白杨，风一吹叶子翻过来，整条路都在闪。 河边 到了河边就坐下了。水不算清，但流得很稳。对岸有人在钓鱼，钓了一下午，好像什么都没钓到，但看起来也不着急。 回来的时候想的事 有时候觉得，写博客这件事跟钓鱼差不多： 大多数时候没有收获； 但坐着的那段时间本身是有价值的； 偶尔真的钓到了，就值得记下来。 这周的小事 修好了阳台上一直漏水的那盆花 把积了三个月的邮件清空了 学会了一道新菜（勉强能入口） 下周打算把相机带出去，拍点东西回来。"},{"href":"posts/2026-10-23-rydberg-single-qubit-gates.html","kind":"article","title":"里德堡量子计算单比特门：逐篇实现细节","date":"2026-10-23","dateText":"2026年10月23日","scope":"category:research","cat":"研究笔记","section":"experiment","sectionName":"实验进展","sectionHref":"categories/research.html#type-experiment","sectionOrder":1,"headings":[{"id":"0-怎么读这份文档","label":"0 · 怎么读这份文档"},{"id":"1-saffman-组-201549-点-cs-阵列上的微波门","label":"1 · Saffman 组 2015：49 点 Cs 阵列上的微波门"},{"id":"平台","label":"平台"},{"id":"编码态制备与读出","label":"编码、态制备与读出"},{"id":"单比特门怎么实现的","label":"单比特门怎么实现的"},{"id":"标定与随机基准测试rb","label":"标定与随机基准测试（RB）"},{"id":"关键参数","label":"关键参数"},{"id":"误差与结论","label":"误差与结论"},{"id":"2-weiss-组-2016三维-cs-光晶格里的靶向相位门","label":"2 · Weiss 组 2016：三维 Cs 光晶格里的“靶向相位门”"},{"id":"平台-2","label":"平台"},{"id":"编码与读出","label":"编码与读出"},{"id":"单比特门怎么实现的重点在不直接翻转","label":"单比特门怎么实现的（重点在“不直接翻转”）"},{"id":"标定与-rb","label":"标定与 RB"},{"id":"关键参数-2","label":"关键参数"},{"id":"结论与局限","label":"结论与局限"},{"id":"3-武汉物数所-2018魔强度光阱把微波门误差压到-310","label":"3 · 武汉物数所 2018：魔强度光阱把微波门误差压到 3×10⁻⁵"},{"id":"平台-3","label":"平台"},{"id":"编码态制备与读出-2","label":"编码、态制备与读出"},{"id":"单比特门怎么实现的-2","label":"单比特门怎么实现的"},{"id":"标定与-rb-2","label":"标定与 RB"},{"id":"误差分解","label":"误差分解"},{"id":"结论与局限-2","label":"结论与局限"},{"id":"4-harvard-2018rydberg-编码-qubit-与激光相位噪声","label":"4 · Harvard 2018：Rydberg 编码 qubit 与激光相位噪声"},{"id":"平台-4","label":"平台"},{"id":"编码","label":"编码"},{"id":"单比特门的光路与核心改进","label":"单比特门的光路与核心改进"},{"id":"结果","label":"结果"},{"id":"结论与局限-3","label":"结论与局限"},{"id":"5-caltech-2020sr-的单光子-rydberg-激发与自电离探测","label":"5 · Caltech 2020：Sr 的单光子 Rydberg 激发与自电离探测"},{"id":"平台-5","label":"平台"},{"id":"编码态制备与读出-3","label":"编码、态制备与读出"},{"id":"单比特门怎么实现的-3","label":"单比特门怎么实现的"},{"id":"结果-2","label":"结果"},{"id":"结论与局限-4","label":"结论与局限"},{"id":"6-princeton-2022yb-核自旋rf-驱动的慢而稳的门","label":"6 · Princeton 2022：¹⁷¹Yb 核自旋，RF 驱动的慢而稳的门"},{"id":"平台-6","label":"平台"},{"id":"编码态制备与读出-4","label":"编码、态制备与读出"},{"id":"单比特门怎么实现的-4","label":"单比特门怎么实现的"},{"id":"相干与两比特背景","label":"相干与两比特（背景）"},{"id":"结论与局限-5","label":"结论与局限"},{"id":"7-jila-2022yb-单束拉曼170-ns-的快速门","label":"7 · JILA 2022：¹⁷¹Yb 单束拉曼，170 ns 的快速门"},{"id":"平台-7","label":"平台"},{"id":"编码态制备与读出-5","label":"编码、态制备与读出"},{"id":"单比特门怎么实现的两种驱动区间","label":"单比特门怎么实现的（两种驱动区间）"},{"id":"相干与误差判断","label":"相干与误差判断"},{"id":"结论与局限-6","label":"结论与局限"},{"id":"8-atom-computing-2022sr-核自旋与-aod-逐点拉曼","label":"8 · Atom Computing 2022：⁸⁷Sr 核自旋与 AOD 逐点拉曼"},{"id":"平台-8","label":"平台"},{"id":"编码态制备与读出-6","label":"编码、态制备与读出"},{"id":"单比特门怎么实现的-5","label":"单比特门怎么实现的"},{"id":"相干","label":"相干"},{"id":"结论与局限-7","label":"结论与局限"},{"id":"9-harvard-20239997-拉曼门与-995-cz-的同一套系统","label":"9 · Harvard 2023：99.97% 拉曼门与 99.5% CZ 的同一套系统"},{"id":"平台-9","label":"平台"},{"id":"编码态制备与读出方法部分的关键改动","label":"编码、态制备与读出（方法部分的关键改动）"},{"id":"单比特门怎么实现的-6","label":"单比特门怎么实现的"},{"id":"rydberg-激发与-cz对照用","label":"Rydberg 激发与 CZ（对照用）"},{"id":"单比特门相关的误差讨论","label":"单比特门相关的误差讨论"},{"id":"结论与位置","label":"结论与位置"},{"id":"10-横向对比","label":"10 · 横向对比"},{"id":"11-误差机理小结","label":"11 · 误差机理小结"},{"id":"12-补充与延伸","label":"12 · 补充与延伸"},{"id":"两篇值得配套读的","label":"两篇值得配套读的"},{"id":"综述","label":"综述"},{"id":"说明","label":"说明"}],"tags":["里德堡","单比特门","量子计算"],"summary":"从 2015 年 Cs 阵列微波门到 2023 年 99.97% 拉曼门，10 篇代表性工作逐篇拆解平台、编码、光路与误差机理。","text":"📄 这是文字版，方便检索与订阅。带图表和完整排版的报告见专题页：《单比特门》。 0 · 怎么读这份文档 先记住一个容易混淆的点：里德堡量子计算机里的“单比特门”，绝大多数不是在里德堡态上做的，而是在编码 qubit 的两个长寿命基态上做；里德堡态只负责两比特相互作用。所以每篇的“单比特门实现”讲的都是三件事： 编码：哪两个态构成 qubit（超精细、核自旋，还是基态–里德堡态）。 驱动：用什么场让这两个态做 Rabi 旋转（微波/RF、拉曼，还是直接 Rydberg 脉冲）。 寻址：怎么只动目标原子而不碰邻居（全局驱动 + 光移选点、聚焦拉曼束、交叉光束相位）。 文中数字默认是论文实测值；凡是我按公式换算的，会写“（换算）”；凡是作者自己的预测，会写“（作者估计）”。 1 · Saffman 组 2015：49 点 Cs 阵列上的微波门 T. Xia, M. Lichtman, K. Maller, A. W. Carr, M. J. Piotrowicz, L. Isenhower, M. Saffman（University of Wisconsin–Madison）· PRL 114, 100503 (2015) · arXiv:1501.02041 · DOI 10.1103/PhysRevLett.114.100503 Cs-133 · 2D 49 点 · 微波 9.19 GHz · Stark 束选点 · RB 0.9983 平台 780 nm 红失谐光阱，7×7 = 49 点，点间距 3.8 μm，阱深约 400 μK。 原子从 2D 冷却区推到玻璃腔，3D MOT 装载；偏振梯度冷却到 5–10 μK；再用约 5 ms 的 852 nm 近共振光触发光助碰撞，保证每点最多一个原子。平均装载 60%，一次实验平均约 29 个点有原子。 成像：MOT 荧光，20 ms 积分；用独立成分分析滤波，单点像素 0.62 μm。 编码、态制备与读出 编码在 Cs 钟态：\\lvert 0\\rangle = \\lvert 6\\mathrm{S}_{1/2},\\,F=3,\\,m_F=0\\rangle，\\lvert 1\\rangle = \\lvert 6\\mathrm{S}_{1/2},\\,F=4,\\,m_F=0\\rangle；劈裂 9.19 GHz。 态制备：894 nm π 偏振光把原子泵到 F=4（6\\mathrm{S}_{1/2}\\,F=4 \\to 6\\mathrm{P}_{1/2}\\,F=4），852 nm π 偏振重泵把 F=3 也推过去；量子化轴由 0.15 mT 偏置场定义，垂直于阵列平面。 态敏读出：先用 852 nm 把 F=4 原子推走（F=4 \\to 6\\mathrm{P}_{3/2}\\,F'=5），再对剩下 F=3 原子做荧光成像。测 \\lvert 0\\rangle 概率直接看“还剩几个原子”；测 \\lvert 1\\rangle 概率则先加一个 π 微波脉冲再推。 单比特门怎么实现的 全局旋转：真空腔外的微波喇叭，9.19 GHz，共振驱动 \\lvert 0\\rangle \\leftrightarrow \\lvert 1\\rangle。实测 Rabi 频率 \\Omega = 2\\pi \\times 4.74\\,\\mathrm{kHz}。Rx 用固定幅度、变长度的脉冲；Ry 靠移相 90°；Rz 由 Rx/Ry 组合而成。 Clifford 集合：用完整的 24 个单比特 Clifford 门 C1，由 \\{I, R_j(\\pm\\pi/2), R_j(\\pi)\\} 生成。为了实现方便，所有 −π/2 旋转都写成 +3π/2，导致每个 Clifford 平均脉冲面积达 7\\pi/4；一个 Clifford 平均耗时约 185 μs。 单点寻址：把微波频率故意失谐 \\delta = 2\\pi \\times 33\\,\\mathrm{kHz}，全局微波对所有人都远离共振（旋转被压制 \\Omega^2/\\delta^2）；再用一束紧聚焦 459 nm 光（腰斑 3.2 × 2.7 μm）对 6\\mathrm{S}_{1/2}\\,F=4 \\to 7\\mathrm{P}_{1/2}\\,F=4 红失谐 20 GHz，在目标点产生差动 Stark 移，把该点的 \\lvert 0\\rangle、\\lvert 1\\rangle 相对移回共振。Stark 束 \\sigma^+ 偏振、垂直阵列平面，用一对正交 AOD 扫描，切换时间 \u003c 0.5 μs。 为什么取 \\delta/\\Omega = \\sqrt{15}：非目标原子受到的非共振脉冲面积接近 4π 的整数倍，残留翻转误差取局部极小。他们从两能级旋转的保真度积分（对 Bloch 球平均）数值验证：\\delta/\\Omega \\approx \\sqrt{15} 时 R_x(\\pi) 的串扰误差最小；实测用 33/8.5 = 3.88。 标定与随机基准测试（RB） 全局 RB：7 组随机 Clifford 序列，长度 \\ell = 1,\\ldots,100；每点 50 次测量。按 P_0 = \\tfrac{1}{2} + \\tfrac{1}{2}(1-d_{\\mathrm{if}})(1-d)^{\\ell} 拟合，用 F^2 = 1 - \\tfrac{d}{2} 报保真度。 单点 RB：10 组序列，长度 {1, 8, 15, 22, 29, 36, 43, 50}；在 47 个点上逐个拟合。 串扰：目标点之外的点制备在 \\lvert 1\\rangle，测每个 Clifford 后的背景翻转概率。 关键参数 原子 / 阵列 Cs-133；7×7，3.8 μm；阱深 ~400 μK 编码 F=3,\\,m_F=0 / F=4,\\,m_F=0；9.19 GHz 驱动 微波喇叭，\\Omega = 2\\pi \\times 4.74\\,\\mathrm{kHz}（全局） 寻址 459 nm Stark 束 + 微波失谐 \\delta=33\\,\\mathrm{kHz}（\\sqrt{15}\\,\\Omega） Clifford 时间 ≈ 185 μs（平均脉冲面积 7\\pi/4） 全局保真度 F^2 = 0.9983(14)；最好点 0.9999(3)，最差点 0.9939 单点保真度 0.9923(7)；串扰误差 0.002(9)（近邻 0.014(20)） 相干 T_1 = 0.59\\,\\mathrm{s}；T_2^* = 14\\,\\mathrm{ms}（中位数 7 ms）；原子寿命 17 s 误差与结论 他们用密度矩阵模拟了失谐（最多 100 Hz，对应阵列内差动 Stark 移）和 200 ns 的脉冲长度抖动（0.2% 微波功率漂移），发现这两项加起来仍比实测误差小几倍。把 T_2^* 的衰减因子代进去，取 \\langle t\\rangle=185\\,\\mu\\mathrm{s}、T_2^* = 2.7\\,\\mathrm{ms}，正好复现实测的 0.9983，所以结论是：限制主要来自有限的 T_2^*（磁噪声 + 有限温度运动效应）和脉冲长度/失谐误差，不是微波源本身。 这篇的意义：第一次在 49 个可单独寻址的原子上把“全局门 + Stark 选点门”都做了 RB 标定，给出了后来被反复引用的 \\delta/\\Omega = \\sqrt{15} 串扰最优点。局限是单点门比全局门差 4.5 倍，原因是 Stark 束强度/指向抖动。 2 · Weiss 组 2016：三维 Cs 光晶格里的“靶向相位门” Yang Wang, Aishwarya Kumar, Tsung-Yao Wu, David S. Weiss（Penn State）· Science 352, 1562 (2016) · arXiv:1601.03639 · DOI 10.1126/science.aaf2581 Cs-133 · 5×5×5 3D · 靶向相位 · 微波 + 880 nm · RB 0.9962 平台 Cs 原子装在 5 μm 间距的立方光晶格，5×5×5 = 125 个点；冷却到约 70% 基态占据。 平均只有约 40% 的点有原子；因此一篇里“48 个目标点”实际每次约 20 个原子参与。 晶格光自发散射是主要退相干源，但 T_2' = 7\\,\\mathrm{s}，远长于 80 μs 的微波脉冲。 编码与读出 编码：\\lvert 1\\rangle = \\lvert 6\\mathrm{S}_{1/2},\\,F=3,\\,m_F=0\\rangle，\\lvert 0\\rangle = \\lvert 6\\mathrm{S}_{1/2},\\,F=4,\\,m_F=0\\rangle。 读出：清掉 \\lvert 4,0\\rangle 原子，对剩下的 \\lvert 3,0\\rangle 成像。 单比特门怎么实现的（重点在“不直接翻转”） 寻址光：两束圆偏振 880.250 nm 光交叉，腰斑约 2.7 μm、瑞利长度 26 μm；交点处对 m_F \\ne 0 的态产生约 2 倍于单束路径的 ac Stark 移。用 MEMS 反射镜把光束指向下一个目标只要 \u003c 5 μs。 门的四段结构：全局 \\lvert 0\\rangle \\leftrightarrow \\lvert 1\\rangle 的 80 μs 共振 π 脉冲（黑）、120 μs 的非共振“寻址”微波脉冲（紫），配合寻址光强线性升降。总有效寻址光时间 252 μs。自旋回波把非目标原子在前两段得到的相位在后两段精确抵消；目标原子因为“交叉点 → 单束路径 → 旁观者”的身份变化，净相位不为零。 相位公式：目标原子净相位 \\varphi \\approx \\frac{\\Omega^2 T}{\\delta-kf} - \\frac{\\Omega^2 T}{\\delta-f} + \\frac{\\Omega^2 T}{\\delta} - \\frac{\\Omega^2 T}{\\delta-f}，其中 \\delta 是相对旁观者共振的微波失谐，f 是单束光造成的 ac Stark 移，k 是交叉点/单束的移比。 工作点 \\delta=74.9\\,\\mathrm{kHz}：这里相位对 δ 的变化是二阶的，而 δ 又正比于寻址光强，所以门对光强是二阶不敏感、对光束指向是四阶不敏感。2% 光强变化 → 8 mrad 相位 → 约 1\\times 10^{-4} 门误差。 任意旋转：这套只直接给 R_z(\\theta)；再用全局 R_x(\\pm\\pi/2) 夹住它，R_y(\\theta) = R_x(\\pi/2)\\,R_z(\\theta)\\,R_x(-\\pi/2)，非目标原子因为两个全局脉冲相消而不受影响。 标定与 RB 先在 48 个随机目标点上做单个 R_z(\\pi/2)，用干涉条纹验证 0.94 的 F^2；再对 24 个目标做完整 RB。 RB 的“计算门”从 \\{R_x(\\pm\\pi/2), R_y(\\pm\\pi/2)\\} 随机取，“泡利门”从 \\{R_x(\\pm\\pi), R_y(\\pm\\pi), R_z(\\pm\\pi), I\\} 随机取；每点平均约 100 次实现。 同时测旁观者、单束路径原子、目标原子的误差，用来分离串扰与自发散射。 关键参数 原子 / 阵列 Cs-133；5×5×5 光晶格，5 μm 编码 \\lvert F=3,0\\rangle / \\lvert F=4,0\\rangle 寻址光 880.250 nm 交叉光束，腰斑 2.7 μm，MEMS 切换 \u003c 5 μs 微波 80 μs 共振 π；120 μs 非共振寻址；工作点 \\delta=74.9\\,\\mathrm{kHz} RB 保真度 0.9962(16)；串扰保真度 0.9979(2) 单门误差 目标 38(16)\\times 10^{-4}；旁观者 17(2)\\times 10^{-4}；单束路径 46(9)\\times 10^{-4} 误差分解（目标） 寻址光自发散射 16\\times 10^{-4}；非共振微波 5.4\\times 10^{-4}；其余主要为全局微波不稳定 结论与局限 这是三维几何里最实用的单点寻址方案：光只提供差分 Stark 移，不要求精确强度，因此适合深阵列。局限是门时间被微波（80 μs 级）和四段序列拖长，且误差主要来自微波功率稳定度，而不是光。 3 · 武汉物数所 2018：魔强度光阱把微波门误差压到 3×10⁻⁵ Cheng Sheng, Xiaodong He, Ruijun Guo, Kunpeng Wang, Peng Xu, Zongyuan Xiong, Min Liu, Jin Wang, Mingsheng Zhan（中科院武汉物数所）· PRL 121, 240501 (2018) · arXiv:1712.06306 · DOI 10.1103/PhysRevLett.121.240501 Rb-87 · 单原子 · 微波 6.834 GHz · 魔强度阱 · 3.0(7)\\times 10^{-5} 平台 单颗 ⁸⁷Rb 原子装在紧聚焦线偏振光阱里，波长约 830 nm；原子从 MOT 装载。 关键装置是一块液晶延迟器：30 ms 内把线偏振阱光变成圆偏振，从而切换到“魔强度”工作点。 偏置磁场 3.2 G（魔强度点需要）；主动磁场稳定把短期噪声从 4 mG 压到 sub-mG。 编码、态制备与读出 编码：\\lvert 0\\rangle = \\lvert 5\\mathrm{S}_{1/2},\\,F=1,\\,m_F=0\\rangle，\\lvert 1\\rangle = \\lvert 5\\mathrm{S}_{1/2},\\,F=2,\\,m_F=0\\rangle。 态制备：795 nm π 偏振（D1，F=1 \\to F'=1）+ 780 nm π 偏振重泵（D2，F=2 \\to F'=2），把原子泵到 \\lvert 0\\rangle。 读出：这里主要靠荧光/推出来判态；论文重点是门，不是单发读出。 单比特门怎么实现的 微波链：商用 6.834 GHz 铷频综（Spectra Dynamics RB-1），相位 F=7/2,\\ m_F=-7/2 的强光，把这个泄漏跃迁移开，散射率压到 ~1 Hz。 单比特门怎么实现的 两束拉曼：经 ³P₁, F=7/2 中间态耦合核自旋；两束同源，各自过一对正交 AOD（vAOD/hAOD），用 AOD 的 RF 幅度/相位做逐点幅度与相位控制。 EOM 侧带：每束一个 EOM，用一阶侧带驱动双光子过程，同时提供快速脉冲整形和中间态失谐调节。 并行方式：同一列（或行）的原子可同时驱动（最多 7 个），不同列串行，三组脉冲覆盖 21 个 qubit；这样每个 qubit 的门是独立的。 参数：Rabi 1.16 kHz，t_{\\pi/2} = 223\\,\\mu\\mathrm{s}。慢的原因正是上面那束隔离光：它的强度/偏振纯度限制了可用的拉曼失谐，从而限制 Rabi。 相位：用“人为失谐”（advance phase）在 Ramsey 中读出相位；每点可编程。 相干 T_1 > 5 s（10 s 内无明显弛豫；受真空寿命 ~60 s 限制） T_2^* 21(7) s（阵列平均） 回波 T_2 42(6) s 门长 / 相干 相干比门长 10^{5} 倍以上 结论与局限 第一次展示“可逐点寻址的核自旋寄存器”，相干时间接近分钟级。局限：门很慢（223 μs），且并行受行/列限制；读出靠 shelving，寿命受阱光限制。它代表“相干优先”的路线，与 JILA 的“速度优先”形成对照。 9 · Harvard 2023：99.97% 拉曼门与 99.5% CZ 的同一套系统 Simon J. Evered, Dolev Bluvstein, Marcin Kalinowski* 等，Mikhail D. Lukin（Harvard / MIT / QuEra）· Nature 622, 268 (2023) · arXiv:2304.05420 · DOI 10.1038/s41586-023-06481-y Rb-87 · 256 原子平台 · 拉曼 1 MHz · BB1 脉冲 · \\delta_{\\mathrm{Raman}} 180 GHz 平台 SLM 生成 850 nm 光镊，810 nm AOD 镊子做重排；先用 780 nm D2 的偏振梯度冷却，再用 795 nm D1 的 Λ 增强灰糖蜜冷却，径向平均声子数 \\bar n \\approx 1\\text{–}2，温度约 10 μK，阱深约 1 mK。 重排后可做缺陷-free 阵列；本文门在 20 原子（一行）到 60 原子（两行）上并行。 编码、态制备与读出（方法部分的关键改动） 编码：\\lvert 0\\rangle = \\lvert F=1,\\,m_F=0\\rangle，\\lvert 1\\rangle = \\lvert F=2,\\,m_F=0\\rangle。 态制备改成三步：先用 \\sigma^+ 780 nm 把原子泵到伸展态 \\lvert F=2,\\,m_F=+2\\rangle（只散射几个光子，避免老方案 40–70 个泵浦周期带来的加热）；把磁场转 90°，让拉曼光有垂直于量子化轴的分量；再用两个拉曼 π 脉冲（Knill 复合脉冲 + 高斯包络）依次转到 \\lvert F=1,\\,m_F=+1\\rangle 和 \\lvert F=2,\\,m_F=0\\rangle；最后把磁场转回。泵浦保真度约 99.7–99.8%。 读出：D2 上 F=2 \\to F'=3 强光把 \\lvert 1\\rangle 推走，对 \\lvert 0\\rangle 成像；推走+成像综合保真度约 99.83%；电路前后背景损失约 0.25% / 0.1%。 单比特门怎么实现的 拉曼系统：用他们此前的“色散光学”方案（Levine 等，PRA 105, 032618, 2022）：对激光做相位调制，再经啁啾布拉格光栅（CBG）的色散转为幅度调制，被动稳定、高效率、可承受高功率——替代传统的声光调制产生 6.8 GHz 边带。 参数：全局拉曼 Rabi 频率 1 MHz；拉曼失谐 180 GHz（远失谐以压低散射）。 脉冲：用 BB1 复合脉冲做鲁棒旋转（对脉冲面积误差不敏感）；Z 旋转直接由控制软件改相位。 保真度：对 Haar 随机单比特旋转采样，测得 99.97%；作者说这与 180 GHz 失谐下的拉曼散射极限一致，因此进一步失谐还能提高。 与两比特的关系：同一套系统里两比特用 420/1013 nm 双光子到 n=53，\\Delta/(2\\pi) = 7.8\\,\\mathrm{GHz}，\\Omega/(2\\pi) = 4.6\\,\\mathrm{MHz}；单比特门和 CZ 共用全局光，只是波长与脉冲不同。 Rydberg 激发与 CZ（对照用） Rydberg 态 53S₁/₂；420 nm \\sigma^+ + 1013 nm \\sigma^- 单光子 Rabi \\Omega_{420} = 2\\pi \\times 237\\,\\mathrm{MHz}；\\Omega_{1013} = 2\\pi \\times 303\\,\\mathrm{MHz} 双光子 \\Delta/(2\\pi) = 7.8\\,\\mathrm{GHz}（60 原子数据用 6.3 GHz）；\\Omega/(2\\pi) = 4.6\\,\\mathrm{MHz} 光斑 SLM 整形为平顶：10×10 μm（20 原子）/ 20×10 μm（60 原子） 相互作用 间距 2 μm，V/(2\\pi) \\approx 450\\,\\mathrm{MHz}；\\mathrm{NA}=0.65 CZ 保真度 99.52(4)%（Bell 衰减）；99.54(2)%（全局 RB）；60 原子 99.48(2)% 单比特门相关的误差讨论 两比特门的主要误差是 Rydberg 衰减、耦合到另一个 m_J、中间态散射，以及 ground–Rydberg T_2^* = 3\\,\\mu\\mathrm{s}（激光光强涨落 + 有限温度）。单比特门本身的 99.97% 已经低于两比特门误差一个量级，所以整套系统的瓶颈明确是两比特门，而不是单比特门。作者对 99.9% CZ 的路径是估计：失谐再远 2 倍、里德堡寿命 3 倍、T_2^* 2 倍，或 Rabi 提高 3 倍。 结论与位置 这是目前公开的、在真实多原子系统上单比特门保真度最高的之一（>99.97%），且与 99.5% 的 CZ 共用一套光路，直接支撑了后续 280 物理比特的逻辑处理器（Bluvstein 等，Nature 2024）。它的“实现细节”价值在于：把拉曼驱动做成被动稳定的色散系统、用 BB1 压脉冲误差、把失谐推到 180 GHz 压散射——这三点是 99.97% 的直接来源。 10 · 横向对比 工作 编码 驱动 门时间 单比特保真度 寻址方式 Saffman 2015 Cs 超精细 微波 Clifford ~185 μs 0.9983（全局）/ 0.9923（单点） 459 nm Stark 束 + \\delta = \\sqrt{15}\\,\\Omega Weiss 2016 Cs 超精细 微波 + 880 nm ~250 μs 序列 0.9962 交叉光束靶向相位 武汉 2018 Rb 超精细 微波（魔强度阱） Clifford 75.7 μs 误差 3.0\\times 10^{-5} 全局 Harvard 2018 Rb 基态–Rydberg 420+1013 nm t_{\\pi} \\sim 250\\,\\mathrm{ns}（\\Omega=2\\,\\mathrm{MHz}） 相位门对比度受探测限制 809 nm 单点光移 Caltech 2020 Sr 钟态–Rydberg 316.6 nm 单光子 t_{\\pi} = 70\\,\\mathrm{ns} 0.9951 / 校正 0.9967 全局 Princeton 2022 Yb 核自旋 RF t_{\\pi/2} \\approx 1.5\\,\\mathrm{ms}（换算） 0.99959 全局 JILA 2022 Yb 核自旋 单束拉曼 t_{\\pi/2} = 170\\,\\mathrm{ns} 误差 5.2\\times 10^{-3} 全局（可扩展） Atom Computing 2022 Sr-87 核自旋 双束拉曼 + AOD t_{\\pi/2} = 223\\,\\mu\\mathrm{s} 未报 RB；T_2^* = 21\\,\\mathrm{s} 逐点（行/列并行） Harvard 2023 Rb 超精细 色散系统拉曼 \\Omega=1\\,\\mathrm{MHz} 0.9997 全局（可扩展） 两条主线很清楚：碱金属超精细 + 拉曼走“速度与保真度”，已经把单比特门做到 10^{-4} 以下；碱土/镱核自旋走“相干时间”，天然没有差分光移，但驱动慢、且两比特门还弱。微波路线则是“稳但慢”，靠魔强度阱也能进 10^{-5}。 11 · 误差机理小结 误差源 物理图像 典型量级 对策与代表工作 差动光移（DLS） 阱光对两个超精细态的光移不同，且随光强/位置变化 \\eta \\sim 10^{-3}；阵列内失谐可达 100 Hz；T_2^* 1–14 ms 魔强度阱（武汉 2018）、魔波长、回波 微波 Rabi 慢 ,{"id":"2-每份材料给一个一句话结论","label":"2. 每份材料给一个「一句话结论」"},{"id":"下周想做的","label":"下周想做的"}],"tags":["工作记录","复盘","效率"],"summary":"这周花了大量时间在检索和整理上，反思了一下怎么让这些一次性的劳动沉淀成资产。","text":"示例文章：工作记录的样子。 这周做了什么 调研了三家做中性原子路线的公司，整理成专题页 把之前散落在聊天记录里的技术要点归并成一份笔记 和同事对齐了下季度的方向 一个反复出现的问题 查过的资料，过一阵子就找不到了。 聊天记录会沉底，浏览器书签会变成垃圾场，下载下来的 PDF 文件名全是乱码。真正的问题不是「找不到」，而是当时没有留下「为什么这条信息重要」的判断。 试的两个办法 1. 换一种记录格式 不写「XX 公司 2024 年完成融资」，而是写： XX 公司的路线是 X，如果 X 成立，那他们的进展速度应该比 Y 快 —— 但公开数据里看不出来。 前者是信息，后者是判断。判断才有复用的价值。 2. 每份材料给一个「一句话结论」 调研页开头强制写一句话，逼自己收敛。 做法 之前 现在 资料存放 下载文件夹 专题页 + 标签 记录内容 事实罗列 事实 + 判断 复用方式 重新搜一遍 站内搜索 下周想做的 把专题页的模板再打磨一下，让「结论」更显眼 每篇笔记强制写一段「这件事对我的意义」 少熬夜（连续第三周立这个 flag）"},{"href":"labs/2026-10-31-cold-atom-reviews.html","kind":"lab","title":"冷原子综述全图（2000–2026）· 完整版","date":"2026-10-31","dateText":"2026年10月31日","scope":"group:综述","cat":"综述","tags":["综述汇总","冷原子","综述","里德堡","光晶格"],"summary":"139 篇冷原子方向综述，按实验形态分 8 类，附 12 个技术要素交叉索引、时间分布、必读 15 篇，以及检索口径与已知边界。","text":"\u003c!DOCTYPE html> 冷原子方向综述全图（2000–2026） 按实验形态分类：系综 / 光晶格 / 单原子阵列。每条都能点开 DOI 或 arXiv 核对。 编制日期 2026-10-31 ／ 完整版 v2 ／ 数据源：Crossref（RMP、Rep. Prog. Phys.、Nature Reviews Physics、Annual Review of Cold Atoms、AAMOP 章节、中文期刊、Science/Nature Physics/Adv. Phys. 专题综述）+ arXiv 综述预印本 目录 总览 必读：引用最高的 15 篇 分类口径与八类总表 技术要素交叉索引 时间分布 按实验形态 A 系综 / 体量子气体 B 光晶格 C 单原子阵列 / 光镊 / 里德堡 D 精密测量 / 时钟 / 干涉 E 腔 QED 与光-原子界面 F 冷分子 / 少体 / 碰撞 G 冷却与操控技术 H 路线图 / 方法学 / 社区报告 方法与说明 检索方法、数据口径与已知边界 修订记录（v1 → v2） 怎么用这份表 分类视图时间线 按引用数 按年份（新→旧） 按年份（旧→新） 按标题 类别 技术要素 来源 ↑ 目录 冷原子综述全图 v2 ｜ 生成于 2026-10-31 ｜ 条目信息全部来自 Crossref / arXiv 返回值，未收录无法核实的条目。 引用数为 Crossref is-referenced-by-count，与 Google Scholar 口径不同，只用于排序、不宜跨库比较。 Electromagnetic trapping of cold atoms V. I. Balykin Vladimir G. Minogin Vladilen S Letokhov Reports on Progress in Physics 2000 Russian Academy of Sciences Bose-Einstein condensation in the alkali gases: Some fundamental concepts Anthony J. Leggett Reviews of Modern Physics 2001 University of Illinois Urbana-Champaign Nobel lecture: When atoms behave as waves: Bose-Einstein condensation a on（均官网证实） 比特载体 只有光镊，光晶格/核自旋当边缘标注 拆成 A1 光镊 / A2 光晶格 / A3 核自旋 三个正式类别 中国公司 8 家 11 家（+ 纳开量子、FlipFlop拓原、乾原量子） 明确排除清单 无 有（IBM/Intel/IonQ 等，附理由） 未完成项 笼统写「有界枚举」 逐条列出 + 原因，补扫后再更新 核心补正：Google 的中性原子路线是 v1 最严重的遗漏——它是超导巨头正式宣布双线，这类「大厂转向/扩张」信号比初创名单更有情报价值。 调研与核验：2026-10-30｜通道：本机 Chrome (CDP 9333) + Bing 调研与核验：2026-10-30 ｜ 通道：本机 Chrome (CDP 9333) + Bing"},{"href":"labs/2026-10-28-rydberg-two-qubit-gates.html","kind":"lab","title":"里德堡原子两比特门：实验进展与实现细节（2010–2026）","date":"2026-10-28","dateText":"2026年10月28日","scope":"group:实验进展","cat":"实验进展","tags":["实验综述","里德堡","两比特门","量子计算"],"summary":"门协议谱系、误差通道量级与十余篇实验细节，附三条硬件路线对比、保真度演进与通往 99.9% 的路径。","text":"\u003c!DOCTYPE html> 目录 先看结论 1 物理机制：三种耦合方式 2 门协议谱系 2.1 串行 π–2π–π 2.2 双全局脉冲 2.3 单脉冲最优控制 2.4 暗态与绝热 2.5 多比特与缀饰 3 误差物理：每条通道的量级 4 逐篇实现细节 2010 Paris · Wilk 2010 Wisconsin · Isenhower 2015 Wisconsin · Maller 2019 Harvard · Levine 2019 Wisconsin · Graham 2020 Caltech · Madjarov 2022 Princeton · Ma 2023 Princeton · Ma 2023 Harvard · Evered 2025 Caltech · Tsai 2026 Harvard · Evered 其他值得知道的工作 5 三条硬件路线横向对比 6 保真度演进 7 瓶颈与 99.9% 的路径 8 参考文献 里德堡原子两比特门：实验进展与实现细节 从 2010 年第一次 Rydberg blockade 纠缠，到 2026 年 99.854% 的 CZ 门——谁做的、用什么协议、脉冲怎么给、误差从哪来。 整理：光镊（里德堡实验） 更新：2026-10-28 依据：arXiv 全文精读 + 论文内误差预算表 §0先看结论 一句话：里德堡两比特门的物理内核是“当一个原子被激发到里德堡态时，邻居的双激发被能量偏移封死”，由此把一束全局激光变成条件操作。所有实验差异，本质上是三件事的组合：用什么原子/什么激发路径、用几个脉冲、错误怎么被压下去。 门不是靠“对准某个原子”实现的，绝大多数现代方案用一束打整片阵列的里德堡激光，靠原子间距（是否落在 blockade 半径内）决定谁和谁纠缠。只有早期的寻址方案（Cs 那批）需要逐个原子打光。 保真度演进大致是：2010 年 Bell 0.58–0.75 → 2015 年 Cs 0.73 → 2019 年 0.86–0.95 → 2023 年 0.9952（Rb）→ 2025 年 0.9971（Sr）→ 2026 年 0.99854（Rb）。实测 门时间在缩短，不是变长：2019 年双脉冲方案 0.4 μs，2023 年 264 ns，2026 年 71 ns。快和准是一起进步的，因为拉比频率提高了约 5 倍。 现在的主要误差已经不是“门协议不好”，而是原子损失（loss）和里德堡态寿命。2026 年哈佛的数据里 loss 占全部误差的 ~60%。这直接催生了“把 loss 当 erasure 用”的纠错路线。 门保真度和“测出来的保真度”是两件事。2025 年 Caltech 明确指出：全局 randomized benchmarking 测的是对称子空间的平均保真度 \\(F_{\\mathrm{Sym}}\\)，不是全空间 Haar 平均 \\(F_{\\mathrm{Haar}}\\)；在 Rydberg 衰变主导时两者可差 12%（极端情况下差 50%）。读论文里的“99.x%”必须看它用的什么基准。 数值标注约定：本文件中 实测 = 论文报告的实验测量值；换算 = 由论文给出的参数直接推算（如门时间 = 无量纲门时长 ÷ 拉比频率）；估计 = 作者自己的外推/理论预测。凡是我无法从原文核实的，会在正文里写明“未读到原文”。 §1物理机制：三种耦合方式 1.1 阻塞（blockade）——几乎所有门都用这个 两个原子都激发到里德堡态 \\(\\lvert rr\\rangle\\) 时，范德瓦尔斯相互作用给这对态一个能量偏移 \\[B = \\frac{C_6}{R^6}\\] 若 \\(B \\gg \\Omega\\)（\\(\\Omega\\) 为基态↔里德堡的拉比频率），则 \\(\\lvert rr\\rangle\\) 被移出共振，双激发被禁止。定义阻塞半径 \\(R_b = \\left(\\frac{C_6}{\\Omega}\\right)^{1/6}\\)：间距小于 \\(R_b\\) 的两个原子构成一个“超级原子”，集体态 \\(\\lvert W\\rangle = \\frac{\\lvert 1r\\rangle + \\lvert r1\\rangle}{\\sqrt{2}}\\) 与 \\(\\lvert 11\\rangle\\) 耦合，拉比频率被增强 \\(\\sqrt{2}\\) 倍。这个 \\(\\sqrt{2}\\) 就是两比特门里唯一的非线性来源： 单个原子（控制原子在 \\(\\lvert 0\\rangle\\)，目标原子在 \\(\\lvert 1\\rangle\\)）：以 \\(\\Omega\\) 振荡，周期 \\(\\frac{2\\pi}{\\Omega}\\)； 两个原子都在 \\(\\lvert 1\\rangle\\)：以 \\(\\sqrt{2}\\,\\Omega\\) 振荡，周期 \\(\\frac{2\\pi}{\\sqrt{2}\\,\\Omega}\\)。 所有 CZ 协议都是在设计脉冲，让这两种情形在末态回到各自的初态、但积累不同的相位。 当间距变近，vdW 可能不够用，或 Rydberg 态之间存在近简并的 \\(\\lvert r'r'\\rangle\\)，就进入 Förster 共振区，相互作用是共振偶极-偶极（\\(\\propto \\frac{1}{R^3}\\)）。此时不能用单一 \\(B\\) 描述，门保真度有更严格的界：2026 年 Norrell/Saffman 给出 \\(F \\le 1 - \\frac{\\pi}{2V\\tau_R}\\)（\\(V\\) 为相互作用强度，\\(\\tau_R\\) 为里德堡寿命），并构造了在大 \\(\\Omega\\) 极限下饱和该界的协议。 1.2 缀饰（dressing）——不激发到里德堡，只“沾一点” 把 \\(\\lvert 1\\rangle\\) 与 \\(\\lvert r\\rangle\\) 大失谐耦合（\\(\\Delta \\gg \\Omega\\)），基态获得一个微小的里德堡成分，两个原子之间产生有效条件能移 \\(\\propto \\frac{\\Omega^4}{\\Delta^3}\\cdot\\frac{1}{R^6}\\)。好处是没有真实布居在里德堡态，自发辐射和 loss 都小；坏处是能移小、门慢（微秒到几十微秒），且对光强噪声敏感。Jau 等人 2016 年的“微波驱动自旋翻转阻塞”（spin-flip blockade，Cs 钟态，Nat. Phys. 12, 71）属于这一族；本文未读该文原文，只按后续文献的引用描述，不给具体参数。 1.3 偶极交换——未来的“天然 iSWAP” 把两个原子激发到一对近简并的里德堡态（\\(\\lvert rr\\rangle\\) 与 \\(\\lvert r'r'\\rangle\\)），共振偶极交换可以把激发在原子间来回传递。这条路线的吸引力是门可以远快于 vdW 门，且天然给出 iSWAP/交换门；难点是需要精确控制直流电场把 Förster 缺陷调到零，且对间距极敏感。2025 年 Ildefonso 等（arXiv:2512.05037）给出 Cs 的数值方案，目前仍是方案，不是实验记录。 §2门协议谱系 记住一个共同起点：1999–2000 年 Jaksch 等提出 \\(\\pi \\; \\text{– gap –} \\; 2\\pi \\; \\text{– gap –} \\; \\pi\\) 的串行方案（PRL 85, 2208）。之后所有协议都在回答同一个问题：能不能不用逐原子寻址、并且更快更稳？ 2.1 串行 π–2π–π（2010–2019 的主流） 控制原子打 \\(\\pi\\) 脉冲进 \\(\\lvert r\\rangle\\) → 目标原子打 \\(2\\pi\\) 脉冲：若控制在 \\(\\lvert 0\\rangle\\)，目标以 \\(\\Omega\\) 走完整 \\(2\\pi\\)，回到 \\(\\lvert 1\\rangle\\) 并积累 −1；若控制在 \\(\\lvert 1\\rangle\\)，blockade 使该跃迁失谐 \\(B\\)，\\(2\\pi\\) 脉冲几乎无效果 → 控制再打 \\(\\pi\\) 脉冲回 \\(\\lvert 0\\rangle\\)。结果是一个 CZ（差一个单比特相位）。 优点 每个原子单独寻址，不依赖全局光束的均匀性；用现有声光偏转器就能扫多个站点。 缺点 总时长 \\(\\sim 4\\pi/\\Omega\\) 再加两段 gap；控制原子要在 \\(\\lvert r\\rangle\\) 里等整个 \\(2\\pi\\) 脉冲 + 两次 gap 的时间，里德堡寿命和运动退相干直接在 gap 里累积；三束脉冲各自的强度/相位误差独立叠加。 实测例子 Wilk 2010（Paris，200 ns 完成纠缠）、Isenhower 2010（Wisconsin，首个 CNOT）、Maller 2015（Cs 2D 阵列）、Graham 2019（121 站点，\\(t_\\pi=150\\,\\mathrm{ns}\\)，\\(t_{2\\pi}=220\\,\\mathrm{ns}\\)，gap=300 ns） 2.2 双全局脉冲（2019，哈佛 Levine） 只用两束全局里德堡脉冲，长度同为 \\(\\tau\\)、失谐同为 \\(\\Delta\\)，第二束相对第一束跳一个相位 \\(\\xi\\)： \\(\\lvert 00\\rangle\\)：两束都不耦合，不动。 \\(\\lvert 01\\rangle\\)/\\(\\lvert 10\\rangle\\)：单原子二能级，Rabi \\(\\Omega\\)、失谐 \\(\\Delta\\)，第一束走“不完整振荡”，第二束绕另一个轴把它转回初态，积累 \\(\\phi_{01}\\)。 \\(\\lvert 11\\rangle\\)：集体态以 \\(\\sqrt{2}\\,\\Omega\\) 振荡，第一束走完一个完整失谐 Rabi 周期，第二束再走一个完整周期，积累 \\(\\phi_{11}\\)。 取 \\(\\Delta \\approx 0.377\\,\\Omega\\) 时满足 \\(\\phi_{11} = 2\\phi_{01} - \\pi\\)，即标准 CZ。总时长 \\(2\\tau \\approx \\frac{2.732\\pi}{\\Omega}\\)，比串行方案快约 1.5 倍，且完全不需要逐点寻址——这是可扩展性的关键一步。实验上要把里德堡光对超精细态的光移用自旋回波抵消，再加一段短光移脉冲消掉单比特相位。 2.3 单脉冲最优控制（2022 起，成为主流） Jandura & Pupillo（Quantum 6, 712, 2022）用最优控制找到在 blockade 区实现 CZ 的时间最优单脉冲：固定幅度、相位随时间变化。哈佛把它参数化成一条极简单的解析曲线： \\(\\phi(t) = A\\cos(\\omega t - \\phi_0) + \\delta_0 t\\)，一组解为 \\(A = 2\\pi \\times 0.1122\\)，\\(\\omega = 1.0431\\,\\Omega\\)，\\(\\phi_0 = -0.7318\\)，\\(\\delta_0 = 0\\)，总时长 \\(\\frac{\\Omega T}{2\\pi} = 1.215\\)（只比单原子共振 \\(2\\pi\\) 脉冲长 21.5%）。 后来又有“平滑幅度”版本（smooth-amplitude）：幅度也随时间变，\\(\\frac{\\Omega_{420}(t)}{\\Omega_{1013}} = \\Omega_0 + \\Omega_1 \\operatorname{sech}^{\\alpha}(\\omega_{\\Omega}\\tau)\\)，相位 \\(\\delta_0\\tau + B\\tanh(\\lambda\\tau)\\)，\\(\\frac{\\Omega T}{2\\pi} = 1.207\\)。它从很低的蓝光拉比频率起步，大部分时间待在暗态，因此中间态散射更小；代价是峰值拉比更高、对有限 blockade 更敏感。 为什么单脉冲更好？（1）没有 gap，里德堡态布居时间最短；（2）只有一个波形要标定，参数少、可全局优化；（3）对有限的脉冲上升时间鲁棒——哈佛的 Extended Data 显示，上升时间 0→40 ns 变化时，仍能重新找到一组参数实现精确 CZ。 2.4 暗态与绝热：把散射压下去 双光子激发经过中间态 \\(\\lvert e\\rangle\\)（Rb 的 \\(6P_{3/2}\\)），散射率 \\(\\propto \\left(\\frac{\\Omega_b}{2\\Delta}\\right)^2\\)。在 \\(\\lvert\\Delta\\rvert \\gg \\lvert\\delta\\rvert,\\, \\Omega\\) 的极限下，三能级系统可以重写成暗态/亮态基： \\(\\lvert D\\rangle = \\frac{-\\lvert 1\\rangle + \\alpha\\lvert r\\rangle}{\\sqrt{1+\\alpha^2}}\\)，\\(\\lvert B\\rangle = \\frac{\\alpha\\lvert 1\\rangle + \\cdots\\lvert e\\rangle + \\lvert r\\rangle}{\\sqrt{1+\\alpha^2}}\\)，其中 \\(\\alpha = \\frac{\\Omega_b}{\\Omega_r}\\)。 暗态不含 \\(\\lvert e\\rangle\\)。关键技巧：当两光子失谐 \\(\\delta\\) 与中间态失谐 \\(\\Delta\\) 反号时，里德堡布居主要走暗态，散射被压低（哈佛 2023 的图 1b 就是这个）。进一步用平滑幅度让脉冲从 \\(\\alpha \\ll 1\\) 起步，几乎全程贴着瞬时暗态走——数值上散射比时间最优门再低 1.2 倍（同长）到 2.5 倍（慢一倍）。 另一族是绝热/鲁棒脉冲：Saffman 的对称 CZ（两个原子同时走绝热脉冲，PRR 2, 033019 配套分析）、Fromonteil/Bluvstein/Pichler 的准静态误差鲁棒脉冲族（PRX Quantum 4, 020335）、Beterov 2026 的反绝热驱动对称 CZ（arXiv:2510.04766）、以及 Endres 组 2026 提出的“让两个量子比特态都参与门”的失谐鲁棒构造（arXiv:2608.27426，把 Stark 光移误差转成单比特相位或直接抵消）。 2.5 多比特与缀饰 原生 CCZ/Toffoli：把三个原子摆成三角，两个控制原子同时 blockade 中间原子。Levine 2019 用 RedCRAB 数值优化得到 CCZ，Toffoli 真值表保真度 87.0(4)%（SPAM 校正）；Evered 2023 找到时间最优 CCZ（\\(\\frac{\\Omega T}{2\\pi} = 1.751\\)，只比 CZ 长 44%），GHZ 保真度 97.9(2)%。 多比特推广：同一套最优控制可给出 4–6 比特的 \\(\\mathrm{C}^k\\mathrm{Z}\\) 脉冲，门时长随比特数增长远慢于拆成 \\(2N\\) 个 CZ 的方案。 缀饰 MS 门：Martin/Jau 2021 用单光子绝热缀饰实现两原子 Mølmer–Sørensen 型门（arXiv:2111.14677），对噪声鲁棒但慢。 §3误差物理：每条通道的量级 这一节是我认为比“保真度数字”更有用的部分。下面每条都给出物理标度，并附 2023/2026 哈佛 Rb 体系里的实测贡献（这两篇的误差预算表最完整）。 误差通道 物理标度 / 来源 实测贡献（Rb，\\(n=53\\)） 有限阻塞 \\(\\propto \\left(\\frac{\\Omega}{B}\\right)^2\\)；\\(B\\) 随 \\(R^{-6}\\) 掉得极快，间距是硬约束。 Förster 共振下界 \\(F \\le 1 - \\frac{\\pi}{2V\\tau_R}\\)。 2026：0.001% （950 MHz blockade，间距 1.73 μm） 里德堡态寿命 \\(\\gamma_r\\)，辐射 \\(\\propto n^3\\)、黑体 \\(\\propto n^2\\)；门期间布居 \\(\\int P_r\\,\\mathrm{d}t/\\tau_R\\)。 可直接导致 loss 或泄漏。 2023：0.113% 2026：0.046% （\\(T_1=88\\,\\mu\\mathrm{s}\\) → 80 μs） 中间态散射 \\(\\propto \\left(\\frac{\\Omega_b}{2\\Delta}\\right)^2\\) ×（寿命 110 ns）；\\(\\lvert 1\\rangle\\) 与 \\(\\lvert 0\\rangle\\) 两条路。 增大 \\(\\Delta\\) 是唯一解，代价是要更高激光功率维持 \\(\\Omega\\)。 2023：\\(\\lvert 1\\rangle\\) 0.103%/0.043%，\\(\\lvert 0\\rangle\\) 0.019% 2026：\\(\\lvert 1\\rangle\\) 0.028%，\\(\\lvert 0\\rangle\\) 0.018% 基态–里德堡相干 \\(T_2^*\\) 失相位误差 \\(\\propto \\frac{1}{(\\Omega T_2^*)^2}\\)；主要来自光移抖动（束指向/功率）与有限温度。 这是当前 Rb 的主要限制之一。 2023：0.134%（\\(T_2^*=3\\,\\mu\\mathrm{s}\\)） 2026：\\(T_2^*=2.8\\text{–}4.7\\,\\mu\\mathrm{s}\\)，合计 0.016% 原子运动（多普勒/位置） 自由飞行期间的相位扩散；位置抖动经 \\(B\\propto R^{-6}\\) 变成失谐抖动。 门期间关阱是常规做法（几 hundred ns）。 2023：位置抖动 0.012% 2026：Doppler 0.007% Yb 2023：多普勒 0.5%（2.9 μK） 激光频率/强度噪声 用保真度响应理论（FRT）把噪声 PSD 与门响应函数卷积。 频率噪声主要在伺服 ~1 MHz 处贡献；强度噪声主要来自 DC/逐发漂移。 2025 起可逐项分解 （Caltech 的 FRT 方法） 原子损失 / 泄漏 里德堡态反阱 → 关阱期间掉原子；衰变到其他 \\(m_F\\) 或低激发态 → 泄漏。 可被探测 → 转成 erasure。 2026：loss 0.087(5)%（占 60%），0.054%/原子/门； 泄漏 0.008(1)%/原子/门 并行串扰 相邻门站点之间残余 vdW 耦合、光束不均匀、里德堡态衰变到邻近 P 态。 Levine 2019：寻址串扰 \u003c2% Graham 2019：Rydberg 串扰 0.005 Evered 2026：稀疏排布门站点以避开 P 态衰变影响 基准测量本身也是误差源。Bell 态保真度会被 SPAM 压低（Evered 2023 单门后 raw 98.0%，SPAM 校正 99.4(4)%，但多门衰减拟合给 99.52(4)%）；echo RB 对单比特误差有一定敏感性（但 X 门夹在 CZ 对之间可消掉单比特相位）；SSB（Tsai 2025）专门设计来去掉单比特敏感性且保持对称子空间平均。三种方法在 2026 年的 Rb 数据上互相吻合到 0.001% 量级，这本身是可信度证据。 §4逐篇实现细节 以下按年份排列。每篇统一按「平台 / 编码与制备 / 激发与门协议 / 关键参数 / 标定与测量 / 误差与局限」六块写。没读到原文的地方我会注明。 2010 · Paris（Browaeys / Grangier）· Wilk 等：第一次用 Rydberg blockade 造出纠缠arXiv:0908.0454 T. Wilk, A. Gaëtan, C. Evellin, J. Wolters, Y. Miroshnychenko, P. Grangier, A. Browaeys, Entanglement of two individual neutral atoms using Rydberg blockade, PRL 104, 010502 (2010). DOI: 10.1103/PhysRevLett.104.010502 平台与配额 两个 ⁸⁷Rb 原子，各自关在 810 nm 光镊里，间距 4 μm，腰斑 0.9 μm，阱深 0.5 mK。两个光镊的光分别收进两个 APD，逐原子判存在。磁场 \\(B=9\\,\\mathrm{G}\\)，沿两原子连线，定义量子化轴。原子温度 60 μK。 编码与制备 编码在两个超精细基态：\\(\\lvert\\uparrow\\rangle = \\lvert 5s_{1/2}, F=2, M=2\\rangle\\)，\\(\\lvert\\downarrow\\rangle = \\lvert 5s_{1/2}, F=1, M=1\\rangle\\)，劈裂 6.8 GHz。里德堡态选 \\(\\lvert r\\rangle = \\lvert 58d_{3/2}, F=3, M=3\\rangle\\)——注意选 d 态而不是 s 态，是为了借 Förster 共振把相互作用放大：4 μm 处计算得到的相互作用能 \\(\\frac{\\Delta E}{h} \\approx 50\\,\\mathrm{MHz}\\)。 激发方案与门（关键：这不是 CZ 门，是“W 态制备 + 映射”） 两步双光子： \\(\\lvert \\uparrow\\rangle\\) → \\(\\lvert r\\rangle\\)：795 nm（\\(\\pi\\) 偏振） + 475 nm（\\(\\sigma^+\\)），795 从 \\(5p_{1/2}(F=2)\\) 蓝失谐 600 MHz 以压自发辐射。测得单原子双光子 \\(\\frac{\\Omega_{\\uparrow r}}{2\\pi} \\approx 6\\,\\mathrm{MHz}\\)（475 nm 功率 30 mW、腰 25 μm；795 nm 15 mW、腰 130 μm）。 \\(\\lvert r\\rangle\\) → \\(\\lvert \\downarrow\\rangle\\)：同一束 475 nm + 第二束 795 nm（偏振垂直于量子化轴，频率高 6.8 GHz），\\(\\frac{\\Omega_{r\\downarrow}}{2\\pi} \\approx 5\\,\\mathrm{MHz}\\)。两束 795 nm 互相锁相，也能做基态间的拉曼旋转。 序列：先打 \\(\\frac{\\pi}{\\sqrt{2}\\,\\Omega_{\\uparrow r}} \\approx 70\\,\\mathrm{ns}\\)，从 \\(\\lvert \\uparrow \\uparrow\\rangle\\) 制备 W 态 \\(\\frac{\\lvert r,\\uparrow\\rangle + \\lvert\\uparrow,r\\rangle}{\\sqrt{2}}\\)（\\(\\sqrt{2}\\) 来自集体增强，这就是 blockade 的直接证据）；再打 \\(\\frac{\\pi}{\\Omega_{r\\downarrow}} \\approx 110\\,\\mathrm{ns}\\) 把 \\(\\lvert r\\rangle\\) 映射到 \\(\\lvert \\downarrow\\rangle\\)，加上 30 ns 间隔，总 ~200 ns。整个过程关掉光镊（否则里德堡态被反阱踢走）。产物是 Bell 态 \\(\\frac{\\lvert\\downarrow\\uparrow\\rangle + e^{i\\phi}\\lvert\\uparrow\\downarrow\\rangle}{\\sqrt{2}}\\)，\\(\\phi\\) 由两束光的波矢差和原子位置决定，同向传播时 \\(\\phi \\approx 0\\)。 测量 读出靠“推走”技术：D2 线 \\(F=2 \\to F=3\\) 共振光把 \\(\\lvert \\uparrow\\rangle\\) 弹出阱，留在阱里的就是 \\(\\lvert \\downarrow\\rangle\\)。因为分不清“\\(\\lvert \\uparrow\\rangle\\)”和“丢原子”，他们另做一次不推开光的实验测剩余对概率 \\(p_{\\mathrm{recap}} = 0.62(3)\\)，只对剩下的对算保真度。相干性通过全局拉曼旋转（相位逐发随机、最后对 \\(2\\pi\\) 平均）从 \\(P_{11}(\\theta)\\) 里提取。 结果与误差 剩余对 61%，保真度 \\(F_{\\mathrm{pairs}}\\) = 0.75(7) 实测 损失 每个原子 0.22(1)，总损失 0.39(2)。来源：中间态自发辐射落到 \\(\\lvert \\downarrow\\rangle\\)（~7%）、激发/映射光强噪声 5% 与频率噪声 3 MHz（~7%）、关阱期间 ~3%、探测 ~3% 主要误差 （1）blockade 不完全，~10% 概率双激发 → 映射成 \\(\\lvert \\downarrow \\downarrow\\rangle\\)，直接看到非零 \\(\\rho_{\\downarrow\\downarrow}=0.06\\)；（2）自发辐射与激发不完美导致 \\(\\rho_{\\uparrow\\uparrow}=0.09\\) 偏大；（3）运动：60 μK 下自由飞行，相位扩散 \\(\\langle e^{i\\phi}\\rangle = 0.94\\)，理论上限 0.97。用 600 ns 间隔重做，相干项掉一半，与模 l） 0.73 2019 Graham（Bell） 0.86 2019 Levine（Bell 下界） 0.950 2020 Madjarov（Bell，校正） 0.991 2023 Ma（CZ） 0.980 2023 Evered（CZ，60 原子） 0.9952 2025 Tsai（CZ，对称平均） 0.9971 2026 Evered（CZ，raw） 0.99854 0.50.6250.750.8751.0 条形长度按“保真度 − 0.5”线性映射。注意各类指标并不完全可比：Wilk/Maller/Levine/Graham/Madjarov 是 Bell 态（或 W 态）保真度，Ma/Evered/Tsai 是 CZ 门保真度；Madjarov 是保守下界，Levine 是下界，Tsai 是对称子空间平均。不要把这些数字直接横比——这正是 §3 结尾强调的基准问题。 §7瓶颈与 99.9% 的路径 7.1 现在到底卡在哪 里德堡寿命（\\(n=53\\)，\\(T_1\\approx80\\,\\mu\\mathrm{s}\\)）：每多 10 ns 门时间就多一份衰变概率。2026 年这项占 0.046%，是第二大项。 中间态散射（\\(\\lvert 1\\rangle\\) 0.028% + \\(\\lvert 0\\rangle\\) 0.018%）：唯一解是加大 \\(\\Delta\\)，但 \\(\\Delta\\) 加大就要更强激光来维持 \\(\\Omega\\)。这是“功率即保真度”的直接体现。 原子损失（0.087%，占 60%）：主要来自里德堡态在阱里的反阱 + 黑体/辐射衰变。已能探测（态选择性读出），可当 erasure 用，但仍是“总误差”里的最大块。 束流稳定性：1015 nm 光强 0.1% 变化、束位置几百 nm 漂移就显著掉保真度；这是长期运行的工程瓶颈（他们靠相机反馈 + 频繁重标定解决）。 并行均匀性：60→442 比特时，光束必须是平顶、且两行都均匀；好在 2023 年已证明站点间差异在统计误差内。 7.2 三条被论文明确写出的改进路径 路径 具体做法 预期 加大 \\(\\Omega\\) + 加大 \\(\\Delta\\) 更高功率 1015 nm；或用脉冲激光；同时把 n 适当降低以增大矩阵元 2023 年作者估计 3 倍 \\(\\Omega\\) + 2 倍 \\(\\Delta\\) → 99.9% 估计 压 \\(\\lvert r'\\rangle\\) 耦合 更强磁场（2026 年已到 13.7 G、38.5 MHz 劈裂）+ 相位 profile 精细优化 该项可压到 \u003c0.005% 估计 改善 \\(T_2^*\\) + 寿命 更好的光束指向稳定、更低温度、更高 n（但要权衡电场敏感度） 2026 年作者：99.9–99.95% 可达 估计 7.3 从门到系统 erasure 化：把 loss 与泄漏变成“位置已知的擦除”，是当前提升纠错阈值最有效的手段（Ma 2023 的 33% 转换、Evered 2026 的 loss 后选择 99.941%）。 非局域连接：靠原子搬运实现任意连接（Evered 2026 的非局域电路），代价是搬运时间与加热，所以门本身要快到 100 ns 量级才有意义。 多比特原生门：CCZ 只比 CZ 长 44%，对减少深度直接有用（Toffoli 分解成 6 个 CZ 不划算）。 基准标准化：SSB 与 FRT 的出现说明领域开始认真对待“保真度到底测的是什么”。跨平台比较前，先确认指标。 §8参考文献 T. Wilk et al., Entanglement of two individual neutral atoms using Rydberg blockade, PRL 104, 010502 (2010). arXiv:0908.0454 · DOI 10.1103/PhysRevLett.104.010502 L. Isenhower et al., Demonstration of a neutral atom controlled-NOT quantum gate, PRL 104, 010503 (2010). arXiv:0907.5552 · DOI 10.1103/PhysRevLett.104.010503 X. L. Zhang et al., Deterministic entanglement of two neutral atoms via Rydberg blockade, PRA 82, 030306(R) (2010). arXiv:1007.0397 K. M. Mall 换算的，会写“（换算）”；凡是作者自己的预测，会写“（作者估计）”。 1Saffman 组 2015：49 点 Cs 阵列上的微波门 T. Xia, M. Lichtman, K. Maller, A. W. Carr, M. J. Piotrowicz, L. Isenhower, M. Saffman（University of Wisconsin–Madison）· PRL 114, 100503 (2015) · arXiv:1501.02041 · DOI 10.1103/PhysRevLett.114.100503 Cs-1332D 49 点微波 9.19 GHzStark 束选点RB 0.9983 平台 780 nm 红失谐光阱，7×7 = 49 点，点间距 3.8 μm，阱深约 400 μK。 原子从 2D 冷却区推到玻璃腔，3D MOT 装载；偏振梯度冷却到 5–10 μK；再用约 5 ms 的 852 nm 近共振光触发光助碰撞，保证每点最多一个原子。平均装载 60%，一次实验平均约 29 个点有原子。 成像：MOT 荧光，20 ms 积分；用独立成分分析滤波，单点像素 0.62 μm。 编码、态制备与读出 编码在 Cs 钟态：\\(\\lvert 0\\rangle = \\lvert 6\\mathrm{S}_{1/2},\\,F=3,\\,m_F=0\\rangle\\)，\\(\\lvert 1\\rangle = \\lvert 6\\mathrm{S}_{1/2},\\,F=4,\\,m_F=0\\rangle\\)；劈裂 9.19 GHz。 态制备：894 nm π 偏振光把原子泵到 \\(F=4\\)（\\(6\\mathrm{S}_{1/2}\\,F=4 \\to 6\\mathrm{P}_{1/2}\\,F=4\\)），852 nm π 偏振重泵把 \\(F=3\\) 也推过去；量子化轴由 0.15 mT 偏置场定义，垂直于阵列平面。 态敏读出：先用 852 nm 把 \\(F=4\\) 原子推走（\\(F=4 \\to 6\\mathrm{P}_{3/2}\\,F'=5\\)），再对剩下 \\(F=3\\) 原子做荧光成像。测 \\(\\lvert 0\\rangle\\) 概率直接看“还剩几个原子”；测 \\(\\lvert 1\\rangle\\) 概率则先加一个 π 微波脉冲再推。 单比特门怎么实现的 全局旋转：真空腔外的微波喇叭，9.19 GHz，共振驱动 \\(\\lvert 0\\rangle \\leftrightarrow \\lvert 1\\rangle\\)。实测 Rabi 频率 \\(\\Omega = 2\\pi \\times 4.74\\,\\mathrm{kHz}\\)。Rx 用固定幅度、变长度的脉冲；Ry 靠移相 90°；Rz 由 Rx/Ry 组合而成。 Clifford 集合：用完整的 24 个单比特 Clifford 门 C1，由 \\(\\{I, R_j(\\pm\\pi/2), R_j(\\pi)\\}\\) 生成。为了实现方便，所有 −π/2 旋转都写成 +3π/2，导致每个 Clifford 平均脉冲面积达 \\(7\\pi/4\\)；一个 Clifford 平均耗时约 185 μs。 单点寻址：把微波频率故意失谐 \\(\\delta = 2\\pi \\times 33\\,\\mathrm{kHz}\\)，全局微波对所有人都远离共振（旋转被压制 \\(\\Omega^2/\\delta^2\\)）；再用一束紧聚焦 459 nm 光（腰斑 3.2 × 2.7 μm）对 \\(6\\mathrm{S}_{1/2}\\,F=4 \\to 7\\mathrm{P}_{1/2}\\,F=4\\) 红失谐 20 GHz，在目标点产生差动 Stark 移，把该点的 \\(\\lvert 0\\rangle\\)、\\(\\lvert 1\\rangle\\) 相对移回共振。Stark 束 \\(\\sigma^+\\) 偏振、垂直阵列平面，用一对正交 AOD 扫描，切换时间 \u003c 0.5 μs。 为什么取 \\(\\delta/\\Omega = \\sqrt{15}\\)：非目标原子受到的非共振脉冲面积接近 4π 的整数倍，残留翻转误差取局部极小。他们从两能级旋转的保真度积分（对 Bloch 球平均）数值验证：\\(\\delta/\\Omega \\approx \\sqrt{15}\\) 时 \\(R_x(\\pi)\\) 的串扰误差最小；实测用 \\(33/8.5 = 3.88\\)。 标定与随机基准测试（RB） 全局 RB：7 组随机 Clifford 序列，长度 \\(\\ell = 1,\\ldots,100\\)；每点 50 次测量。按 \\(P_0 = \\tfrac{1}{2} + \\tfrac{1}{2}(1-d_{\\mathrm{if}})(1-d)^{\\ell}\\) 拟合，用 \\(F^2 = 1 - \\tfrac{d}{2}\\) 报保真度。 单点 RB：10 组序列，长度 {1, 8, 15, 22, 29, 36, 43, 50}；在 47 个点上逐个拟合。 串扰：目标点之外的点制备在 \\(\\lvert 1\\rangle\\)，测每个 Clifford 后的背景翻转概率。 关键参数 原子 / 阵列 Cs-133；7×7，3.8 μm；阱深 ~400 μK 编码 \\(F=3,\\,m_F=0\\) / \\(F=4,\\,m_F=0\\)；9.19 GHz 驱动 微波喇叭，\\(\\Omega = 2\\pi \\times 4.74\\,\\mathrm{kHz}\\)（全局） 寻址 459 nm Stark 束 + 微波失谐 \\(\\delta=33\\,\\mathrm{kHz}\\)（\\(\\sqrt{15}\\,\\Omega\\)） Clifford 时间 ≈ 185 μs（平均脉冲面积 \\(7\\pi/4\\)） 全局保真度 \\(F^2\\) = 0.9983(14)；最好点 0.9999(3)，最差点 0.9939 单点保真度 0.9923(7)；串扰误差 0.002(9)（近邻 0.014(20)） 相干 \\(T_1 = 0.59\\,\\mathrm{s}\\)；\\(T_2^* = 14\\,\\mathrm{ms}\\)（中位数 7 ms）；原子寿命 17 s 误差与结论 他们用密度矩阵模拟了失谐（最多 100 Hz，对应阵列内差动 Stark 移）和 200 ns 的脉冲长度抖动（0.2% 微波功率漂移），发现这两项加起来仍比实测误差小几倍。把 \\(T_2^*\\) 的衰减因子代进去，取 \\(\\langle t\\rangle=185\\,\\mu\\mathrm{s}\\)、\\(T_2^* = 2.7\\,\\mathrm{ms}\\)，正好复现实测的 0.9983，所以结论是：限制主要来自有限的 \\(T_2^*\\)（磁噪声 + 有限温度运动效应）和脉冲长度/失谐误差，不是微波源本身。 这篇的意义：第一次在 49 个可单独寻址的原子上把“全局门 + Stark 选点门”都做了 RB 标定，给出了后来被反复引用的 \\(\\delta/\\Omega = \\sqrt{15}\\) 串扰最优点。局限是单点门比全局门差 4.5 倍，原因是 Stark 束强度/指向抖动。 2Weiss 组 2016：三维 Cs 光晶格里的“靶向相位门” Yang Wang, Aishwarya Kumar, Tsung-Yao Wu, David S. Weiss（Penn State）· Science 352, 1562 (2016) · arXiv:1601.03639 · DOI 10.1126/science.aaf2581 Cs-1335×5×5 3D靶向相位微波 + 880 nmRB 0.9962 平台 Cs 原子装在 5 μm 间距的立方光晶格，5×5×5 = 125 个点；冷却到约 70% 基态占据。 平均只有约 40% 的点有原子；因此一篇里“48 个目标点”实际每次约 20 个原子参与。 晶格光自发散射是主要退相干源，但 \\(T_2' = 7\\,\\mathrm{s}\\)，远长于 80 μs 的微波脉冲。 编码与读出 编码：\\(\\lvert 1\\rangle = \\lvert 6\\mathrm{S}_{1/2},\\,F=3,\\,m_F=0\\rangle\\)，\\(\\lvert 0\\rangle = \\lvert 6\\mathrm{S}_{1/2},\\,F=4,\\,m_F=0\\rangle\\)。 读出：清掉 \\(\\lvert 4,0\\rangle\\) 原子，对剩下的 \\(\\lvert 3,0\\rangle\\) 成像。 单比特门怎么实现的（重点在“不直接翻转”） 寻址光：两束圆偏振 880.250 nm 光交叉，腰斑约 2.7 μm、瑞利长度 26 μm；交点处对 \\(m_F \\ne 0\\) 的态产生约 2 倍于单束路径的 ac Stark 移。用 MEMS 反射镜把光束指向下一个目标只要 \u003c 5 μs。 门的四段结构：全局 \\(\\lvert 0\\rangle \\leftrightarrow \\lvert 1\\rangle\\) 的 80 μs 共振 π 脉冲（黑）、120 μs 的非共振“寻址”微波脉冲（紫），配合寻址光强线性升降。总有效寻址光时间 252 μs。自旋回波把非目标原子在前两段得到的相位在后两段精确抵消；目标原子因为“交叉点 → 单束路径 → 旁观者”的身份变化，净相位不为零。 相位公式：目标原子净相位 \\(\\varphi \\approx \\frac{\\Omega^2 T}{\\delta-kf} - \\frac{\\Omega^2 T}{\\delta-f} + \\frac{\\Omega^2 T}{\\delta} - \\frac{\\Omega^2 T}{\\delta-f}\\)，其中 \\(\\delta\\) 是相对旁观者共振的微波失谐，\\(f\\) 是单束光造成的 ac Stark 移，\\(k\\) 是交叉点/单束的移比。 工作点 \\(\\delta=74.9\\,\\mathrm{kHz}\\)：这里相位对 δ 的变化是二阶的，而 δ 又正比于寻址光强，所以门对光强是二阶不敏感、对光束指向是四阶不敏感。2% 光强变化 → 8 mrad 相位 → 约 \\(1\\times 10^{-4}\\) 门误差。 任意旋转：这套只直接给 \\(R_z(\\theta)\\)；再用全局 \\(R_x(\\pm\\pi/2)\\) 夹住它，\\(R_y(\\theta) = R_x(\\pi/2)\\,R_z(\\theta)\\,R_x(-\\pi/2)\\)，非目标原子因为两个全局脉冲相消而不受影响。 标定与 RB 先在 48 个随机目标点上做单个 \\(R_z(\\pi/2)\\)，用干涉条纹验证 0.94 的 \\(F^2\\)；再对 24 个目标做完整 RB。 RB 的“计算门”从 \\(\\{R_x(\\pm\\pi/2), R_y(\\pm\\pi/2)\\}\\) 随机取，“泡利门”从 \\(\\{R_x(\\pm\\pi), R_y(\\pm\\pi), R_z(\\pm\\pi), I\\}\\) 随机取；每点平均约 100 次实现。 同时测旁观者、单束路径原子、目标原子的误差，用来分离串扰与自发散射。 关键参数 原子 / 阵列 Cs-133；5×5×5 光晶格，5 μm 编码 \\(\\lvert F=3,0\\rangle / \\lvert F=4,0\\rangle\\) 寻址光 880.250 nm 交叉光束，腰斑 2.7 μm，MEMS 切换 \u003c 5 μs 微波 80 μs 共振 π；120 μs 非共振寻址；工作点 \\(\\delta=74.9\\,\\mathrm{kHz}\\) RB 保真度 0.9962(16)；串扰保真度 0.9979(2) 单门误差 目标 \\(38(16)\\times 10^{-4}\\)；旁观者 \\(17(2)\\times 10^{-4}\\)；单束路径 \\(46(9)\\times 10^{-4}\\) 误差分解（目标） 寻址光自发散射 \\(16\\times 10^{-4}\\)；非共振微波 \\(5.4\\times 10^{-4}\\)；其余主要为全局微波不稳定 结论与局限 这是三维几何里最实用的单点寻址方案：光只提供差分 Stark 移，不要求精确强度，因此适合深阵列。局限是门时间被微波（80 μs 级）和四段序列拖长，且误差主要来自微波功率稳定度，而不是光。 3武汉物数所 2018：魔强度光阱把微波门误差压到 3×10⁻⁵ Cheng Sheng, Xiaodong He, Ruijun Guo, Kunpeng Wang, Peng Xu, Zongyuan Xiong, Min Liu, Jin Wang, Mingsheng Zhan（中科院武汉物数所）· PRL 121, 240501 (2018) · arXiv:1712.06306 · DOI 10.1103/PhysRevLett.121.240501 Rb-87单原子微波 6.834 GHz魔强度阱\\(3.0(7)\\times 10^{-5}\\) 平台 单颗 ⁸⁷Rb 原子装在紧聚焦线偏振光阱里，波长约 830 nm；原子从 MOT 装载。 关键装置是一块液晶延迟器：30 ms 内把线偏振阱光变成圆偏振，从而切换到“魔强度”工作点。 偏置磁场 3.2 G（魔强度点需要）；主动磁场稳定把短期噪声从 4 mG 压到 sub-mG。 编码、态制备与读出 编码：\\(\\lvert 0\\rangle = \\lvert 5\\mathrm{S}_{1/2},\\,F=1,\\,m_F=0\\rangle\\ 约 10 μK，阱深约 1 mK。 重排后可做缺陷-free 阵列；本文门在 20 原子（一行）到 60 原子（两行）上并行。 编码、态制备与读出（方法部分的关键改动） 编码：\\(\\lvert 0\\rangle = \\lvert F=1,\\,m_F=0\\rangle\\)，\\(\\lvert 1\\rangle = \\lvert F=2,\\,m_F=0\\rangle\\)。 态制备改成三步：先用 \\(\\sigma^+\\) 780 nm 把原子泵到伸展态 \\(\\lvert F=2,\\,m_F=+2\\rangle\\)（只散射几个光子，避免老方案 40–70 个泵浦周期带来的加热）；把磁场转 90°，让拉曼光有垂直于量子化轴的分量；再用两个拉曼 π 脉冲（Knill 复合脉冲 + 高斯包络）依次转到 \\(\\lvert F=1,\\,m_F=+1\\rangle\\) 和 \\(\\lvert F=2,\\,m_F=0\\rangle\\)；最后把磁场转回。泵浦保真度约 99.7–99.8%。 读出：D2 上 \\(F=2 \\to F'=3\\) 强光把 \\(\\lvert 1\\rangle\\) 推走，对 \\(\\lvert 0\\rangle\\) 成像；推走+成像综合保真度约 99.83%；电路前后背景损失约 0.25% / 0.1%。 单比特门怎么实现的 拉曼系统：用他们此前的“色散光学”方案（Levine 等，PRA 105, 032618, 2022）：对激光做相位调制，再经啁啾布拉格光栅（CBG）的色散转为幅度调制，被动稳定、高效率、可承受高功率——替代传统的声光调制产生 6.8 GHz 边带。 参数：全局拉曼 Rabi 频率 1 MHz；拉曼失谐 180 GHz（远失谐以压低散射）。 脉冲：用 BB1 复合脉冲做鲁棒旋转（对脉冲面积误差不敏感）；Z 旋转直接由控制软件改相位。 保真度：对 Haar 随机单比特旋转采样，测得 99.97%；作者说这与 180 GHz 失谐下的拉曼散射极限一致，因此进一步失谐还能提高。 与两比特的关系：同一套系统里两比特用 420/1013 nm 双光子到 \\(n=53\\)，\\(\\Delta/(2\\pi) = 7.8\\,\\mathrm{GHz}\\)，\\(\\Omega/(2\\pi) = 4.6\\,\\mathrm{MHz}\\)；单比特门和 CZ 共用全局光，只是波长与脉冲不同。 Rydberg 激发与 CZ（对照用） Rydberg 态 53S₁/₂；420 nm \\(\\sigma^+\\) + 1013 nm \\(\\sigma^-\\) 单光子 Rabi \\(\\Omega_{420} = 2\\pi \\times 237\\,\\mathrm{MHz}\\)；\\(\\Omega_{1013} = 2\\pi \\times 303\\,\\mathrm{MHz}\\) 双光子 \\(\\Delta/(2\\pi) = 7.8\\,\\mathrm{GHz}\\)（60 原子数据用 6.3 GHz）；\\(\\Omega/(2\\pi) = 4.6\\,\\mathrm{MHz}\\) 光斑 SLM 整形为平顶：10×10 μm（20 原子）/ 20×10 μm（60 原子） 相互作用 间距 2 μm，\\(V/(2\\pi) \\approx 450\\,\\mathrm{MHz}\\)；\\(\\mathrm{NA}=0.65\\) CZ 保真度 99.52(4)%（Bell 衰减）；99.54(2)%（全局 RB）；60 原子 99.48(2)% 单比特门相关的误差讨论 两比特门的主要误差是 Rydberg 衰减、耦合到另一个 \\(m_J\\)、中间态散射，以及 ground–Rydberg \\(T_2^* = 3\\,\\mu\\mathrm{s}\\)（激光光强涨落 + 有限温度）。单比特门本身的 99.97% 已经低于两比特门误差一个量级，所以整套系统的瓶颈明确是两比特门，而不是单比特门。作者对 99.9% CZ 的路径是估计：失谐再远 2 倍、里德堡寿命 3 倍、\\(T_2^*\\) 2 倍，或 Rabi 提高 3 倍。 结论与位置 这是目前公开的、在真实多原子系统上单比特门保真度最高的之一（>99.97%），且与 99.5% 的 CZ 共用一套光路，直接支撑了后续 280 物理比特的逻辑处理器（Bluvstein 等，Nature 2024）。它的“实现细节”价值在于：把拉曼驱动做成被动稳定的色散系统、用 BB1 压脉冲误差、把失谐推到 180 GHz 压散射——这三点是 99.97% 的直接来源。 10横向对比 工作 编码 驱动 门时间 单比特保真度 寻址方式 Saffman 2015 Cs 超精细 微波 Clifford ~185 μs 0.9983（全局）/ 0.9923（单点） 459 nm Stark 束 + \\(\\delta = \\sqrt{15}\\,\\Omega\\) Weiss 2016 Cs 超精细 微波 + 880 nm ~250 μs 序列 0.9962 交叉光束靶向相位 武汉 2018 Rb 超精细 微波（魔强度阱） Clifford 75.7 μs 误差 \\(3.0\\times 10^{-5}\\) 全局 Harvard 2018 Rb 基态–Rydberg 420+1013 nm \\(t_{\\pi} \\sim 250\\,\\mathrm{ns}\\)（\\(\\Omega=2\\,\\mathrm{MHz}\\)） 相位门对比度受探测限制 809 nm 单点光移 Caltech 2020 Sr 钟态–Rydberg 316.6 nm 单光子 \\(t_{\\pi} = 70\\,\\mathrm{ns}\\) 0.9951 / 校正 0.9967 全局 Princeton 2022 Yb 核自旋 RF \\(t_{\\pi/2} \\approx 1.5\\,\\mathrm{ms}\\)（换算） 0.99959 全局 JILA 2022 Yb 核自旋 单束拉曼 \\(t_{\\pi/2} = 170\\,\\mathrm{ns}\\) 误差 \\(5.2\\times 10^{-3}\\) 全局（可扩展） Atom Computing 2022 Sr-87 核自旋 双束拉曼 + AOD \\(t_{\\pi/2} = 223\\,\\mu\\mathrm{s}\\) 未报 RB；\\(T_2^* = 21\\,\\mathrm{s}\\) 逐点（行/列并行） Harvard 2023 Rb 超精细 色散系统拉曼 \\(\\Omega=1\\,\\mathrm{MHz}\\) 0.9997 全局（可扩展） 两条主线很清楚：碱金属超精细 + 拉曼走“速度与保真度”，已经把单比特门做到 \\(10^{-4}\\) 以下；碱土/镱核自旋走“相干时间”，天然没有差分光移，但驱动慢、且两比特门还弱。微波路线则是“稳但慢”，靠魔强度阱也能进 \\(10^{-5}\\)。 11误差机理小结 误差源 物理图像 典型量级 对策与代表工作 差动光移（DLS） 阱光对两个超精细态的光移不同，且随光强/位置变化 \\(\\eta \\sim 10^{-3}\\)；阵列内失谐可达 100 Hz；\\(T_2^*\\) 1–14 ms 魔强度阱（武汉 2018）、魔波长、回波 微波 Rabi 慢 超精细劈裂在 GHz，微波 Rabi 只有 kHz Clifford 75–185 μs 拉曼提速（JILA 170 ns；Harvard 1 MHz） 拉曼/中间态散射 经激发态虚耦合，有限失谐下真实布居 碱金属 \\(T_1\\sim 0.5\\text{–}1\\,\\mathrm{s}\\)；Rb 双光子散射 ~80 μs 增大失谐（Harvard 180 GHz）、暗态、单光子（Sr） 激光相位噪声 ~1 MHz 处的高频噪声直接变成 Rydberg 失谐 Rabi 相干 7 → 27 μs 参考腔滤波 + 注入锁定（Harvard 2018） 多普勒 有限温度下每颗原子随机失谐 10 μK → 43.5 kHz 回波、拉曼边带冷却（JILA \\(\\bar n \\approx 0.14\\)） 寻址串扰 聚焦光斑溢出到邻居 单点 0.992 vs 全局 0.998；串扰 0.2%–5% \\(\\delta/\\Omega=\\sqrt{15}\\)（Saffman）、靶向相位（Weiss）、AOD 闭环 核自旋特有 无超精细耦合 → \\(\\mathrm{DLS}\\approx 0\\)；限制变成磁场与光泄漏 \\(T_2^*\\) 秒级；\\(T_1\\) 数十秒 磁场稳定、挡光、magic 波长（Yb \\(486.78\\,\\mathrm{nm}\\)） 一句话总结：单比特门本身已经不是里德堡平台的瓶颈。Rb 拉曼已经到 99.97%（Harvard 2023）、微波 + 魔强度阱到 \\(3\\times 10^{-5}\\)（武汉 2018）、Yb 核自旋 RB 到 99.959%（Princeton 2022）。真正卡住整机的是两比特门（Harvard CZ 99.5%，Yb CZ 83%）、原子损失、并行寻址串扰与校准开销。 12补充与延伸 两篇值得配
